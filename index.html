<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>إسراء ومُعتَز · مذكرات سفر</title>
<meta name="description" content="مذكّرات سفر — رحلات إسراء ومُعتَز حول العالم">
<meta name="theme-color" content="#F5EFE5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Caveat:wght@400;600;700&family=Markazi+Text:wght@400;500;600;700&family=Tajawal:wght@200;300;400;500;700;900&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. BASE & DESIGN TOKENS
   ========================================================= */
:root {
  /* Warm beige & sand palette per spec */
  --cream:        #F5EFE5;
  --cream-warm:   #EFE5D2;
  --cream-soft:   #FAF6EE;
  --cream-deep:   #E8DCC4;
  --sand:         #DCC9A8;
  --paper:        #FBF7EF;

  --ink:          #2A1F15;
  --ink-soft:     #4A3B2C;
  --ink-mute:     #8A7A65;
  --ink-light:    #B8A88E;

  --gold:         #C9A961;
  --gold-deep:    #A8893D;
  --terracotta:   #B85C43;
  --rust:         #8E3F2C;
  --moss:         #6B7A4E;
  --slate-blue:   #7B96A8;

  --line:         rgba(42,31,21,0.10);
  --line-strong:  rgba(42,31,21,0.20);

  --shadow-sm:    0 2px 8px rgba(42,31,21,0.06);
  --shadow-md:    0 8px 24px rgba(42,31,21,0.10);
  --shadow-lg:    0 20px 48px rgba(42,31,21,0.14);
  --shadow-photo: 0 6px 20px rgba(42,31,21,0.18), 0 2px 4px rgba(42,31,21,0.08);

  --radius-sm:    8px;
  --radius-md:    14px;
  --radius-lg:    20px;
  --radius-xl:    28px;

  --ease:         cubic-bezier(.2,.7,.2,1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { background: var(--cream); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  font-family: 'Tajawal', system-ui, sans-serif;
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.6;
  /* Subtle paper texture overlay across whole site */
  background-image:
    radial-gradient(at 20% 10%, rgba(201,169,97,0.05) 0%, transparent 50%),
    radial-gradient(at 80% 90%, rgba(184,92,67,0.04) 0%, transparent 50%);
  background-attachment: fixed;
}

button { background: none; border: none; cursor: pointer; font-family: inherit; color: inherit; font-size: inherit; padding: 0; text-align: inherit; }
input, textarea, select { font-family: inherit; }
a { color: inherit; text-decoration: none; cursor: pointer; }
img, svg { display: block; max-width: 100%; }
img { height: auto; }

/* Typography utility classes */
.display      { font-family: 'Markazi Text', 'Amiri', serif; line-height: 1.15; }
.display-en   { font-family: 'Playfair Display', Georgia, serif; }
.script-en    { font-family: 'Caveat', cursive; }
.serif-en     { font-family: 'Cormorant Garamond', Georgia, serif; }

/* Selection */
::selection { background: var(--gold); color: var(--ink); }

/* Focus */
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }

/* =========================================================
   2. LAYOUT
   ========================================================= */
.container { max-width: 78rem; margin: 0 auto; padding: 0 1.25rem; }
@media (min-width: 640px) { .container { padding: 0 2rem; } }
@media (min-width: 1024px) { .container { padding: 0 3rem; } }

.container-narrow { max-width: 56rem; margin: 0 auto; padding: 0 1.25rem; }
@media (min-width: 640px) { .container-narrow { padding: 0 2rem; } }

/* =========================================================
   3. NAVIGATION
   ========================================================= */
.nav {
  position: sticky; top: 0; z-index: 40;
  background: rgba(245,239,229,0.88);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid var(--line);
}
.nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 0.875rem 0; }
.nav-logo { display: flex; align-items: center; gap: 0.625rem; }
.nav-logo-name { font-family: 'Markazi Text', serif; font-size: 1.5rem; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
@media (min-width: 640px) { .nav-logo-name { font-size: 1.75rem; } }
.nav-logo-en { font-family: 'Caveat', cursive; font-size: 1.125rem; color: var(--gold-deep); margin-bottom: -0.25rem; display: none; }
@media (min-width: 768px) { .nav-logo-en { display: inline; } }

.nav-links { display: flex; align-items: center; gap: 1.25rem; font-size: 0.875rem; color: var(--ink-soft); }
@media (min-width: 640px) { .nav-links { gap: 1.5rem; font-size: 0.9375rem; } }
.nav-link { position: relative; transition: color 0.2s ease; padding-bottom: 4px; }
.nav-link::after { content: ''; position: absolute; right: 0; left: 0; bottom: -2px; height: 1px; background: var(--terracotta); transform: scaleX(0); transform-origin: right; transition: transform 0.3s var(--ease); }
.nav-link:hover::after, .nav-link.active::after { transform: scaleX(1); }
.nav-link:hover, .nav-link.active { color: var(--ink); }
.nav-add-btn {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.5rem 0.875rem; border-radius: 9999px;
  background: var(--ink); color: var(--cream-soft); font-size: 0.8125rem; font-weight: 500;
  transition: background 0.2s ease, transform 0.2s ease;
}
.nav-add-btn:hover { background: var(--terracotta); }
.nav-add-btn:active { transform: translateY(1px); }
.hidden-md { display: none; }
@media (min-width: 768px) { .hidden-md { display: inline-block; } }

/* =========================================================
   4. HERO — large image-masked letters "Israa & Muataz"
   ========================================================= */
.hero {
  position: relative;
  padding: 3.5rem 1.25rem 5rem;
  text-align: center;
  overflow: hidden;
}
@media (min-width: 640px) { .hero { padding: 5rem 2rem 6rem; } }
@media (min-width: 1024px) { .hero { padding: 6rem 3rem 7rem; } }

.hero-supertitle {
  font-family: 'Caveat', cursive;
  font-size: 1.5rem;
  color: var(--gold-deep);
  margin-bottom: 0.5rem;
  letter-spacing: 0.02em;
}
@media (min-width: 640px) { .hero-supertitle { font-size: 1.875rem; } }

.hero-arabic-intro {
  font-family: 'Markazi Text', serif;
  font-size: 1.125rem;
  color: var(--ink-soft);
  margin-bottom: 2.5rem;
  letter-spacing: 0.02em;
}
@media (min-width: 640px) { .hero-arabic-intro { font-size: 1.375rem; margin-bottom: 3rem; } }

/* The masked-letters title */
.hero-title {
  font-family: 'Anton', 'Archivo Black', sans-serif;
  font-weight: 400;
  line-height: 0.88;
  letter-spacing: 0.01em;
  /* Fallback color for browsers that don't support background-clip:text */
  color: var(--ink);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.05em;
  margin-bottom: 2.25rem;
  /* dir-ltr because letters read left-to-right inside an RTL page */
}

.hero-title-line {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: clamp(4.5rem, 18vw, 11rem);
  /* Reserve generous height for tall letters */
}

.hero-title-line-amp {
  font-family: 'Playfair Display', serif;
  font-style: italic;
  font-weight: 400;
  font-size: clamp(2.75rem, 10vw, 6rem);
  color: var(--gold-deep);
  line-height: 1;
}

.letter {
  display: inline-block;
  /* Image-masked text — falls back to color if unsupported */
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  transition: transform 0.4s var(--ease), filter 0.4s ease;
  padding: 0 0.005em;
}
.letter:hover { transform: translateY(-4px); filter: brightness(1.1) saturate(1.15); }

/* Fallback for browsers without background-clip text */
@supports not ((-webkit-background-clip: text) or (background-clip: text)) {
  .letter { color: var(--terracotta); -webkit-text-fill-color: var(--terracotta); background: none !important; }
}

.hero-subtitle {
  font-family: 'Markazi Text', serif;
  font-size: 1.25rem;
  color: var(--ink-soft);
  max-width: 36rem;
  margin: 0 auto;
  line-height: 1.6;
}
@media (min-width: 640px) { .hero-subtitle { font-size: 1.5rem; } }

.hero-decoration {
  display: flex; align-items: center; justify-content: center; gap: 1rem;
  margin: 1.75rem auto 0;
  color: var(--gold-deep);
}
.hero-decoration-line { width: 3rem; height: 1px; background: var(--gold); opacity: 0.5; }
.hero-decoration-dot { width: 4px; height: 4px; border-radius: 9999px; background: var(--gold-deep); }

/* =========================================================
   5. DESTINATIONS GRID
   ========================================================= */
.destinations-section { padding: 2rem 0 6rem; position: relative; }

.section-heading {
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
  margin-bottom: 3rem;
  gap: 0.5rem;
}
.section-heading-en {
  font-family: 'Caveat', cursive;
  font-size: 1.5rem;
  color: var(--gold-deep);
}
.section-heading-ar {
  font-family: 'Markazi Text', serif;
  font-size: 2.25rem;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.1;
}
@media (min-width: 640px) { .section-heading-ar { font-size: 3rem; } }
.section-heading-sub {
  font-size: 0.9375rem;
  color: var(--ink-mute);
  margin-top: 0.25rem;
  max-width: 30rem;
}
.section-heading-deco {
  display: flex; align-items: center; gap: 0.625rem;
  margin-top: 0.75rem; color: var(--gold-deep);
}
.section-heading-deco-line { width: 2.5rem; height: 1px; background: currentColor; opacity: 0.4; }

.destinations-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 2.5rem 1.75rem;
}
@media (min-width: 640px) { .destinations-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1024px) { .destinations-grid { grid-template-columns: repeat(3, 1fr); gap: 3rem 2rem; } }

/* Destination card — clean polaroid-inspired but modern */
.dest-card {
  position: relative;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  background: var(--paper);
  padding: 0.875rem 0.875rem 1.25rem;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-photo);
  transition: transform 0.5s var(--ease), box-shadow 0.5s var(--ease);
  text-align: right;
  width: 100%;
}
@media (min-width: 640px) {
  /* Subtle alternating tilt for visual rhythm */
  .destinations-grid > .dest-card:nth-child(3n+1) { transform: rotate(-0.4deg); }
  .destinations-grid > .dest-card:nth-child(3n+2) { transform: rotate(0.3deg); }
  .destinations-grid > .dest-card:nth-child(3n+3) { transform: rotate(-0.2deg); }
}
.dest-card:hover { transform: translateY(-8px) rotate(0deg); box-shadow: var(--shadow-lg); }
.dest-card:focus-visible { transform: translateY(-8px) rotate(0deg); }

/* Washi tape decoration on top of card */
.dest-card-tape {
  position: absolute;
  top: -10px; left: 50%;
  transform: translateX(-50%) rotate(-2deg);
  width: 3.5rem; height: 18px;
  background: rgba(201,169,97,0.5);
  border-radius: 2px;
  box-shadow: 0 1px 3px rgba(42,31,21,0.1);
  pointer-events: none;
}
.dest-card:nth-child(2n) .dest-card-tape { background: rgba(184,92,67,0.45); transform: translateX(-50%) rotate(2deg); }
.dest-card:nth-child(3n) .dest-card-tape { background: rgba(123,150,168,0.45); }

.dest-card-photo {
  position: relative;
  aspect-ratio: 4/5;
  border-radius: var(--radius-sm);
  overflow: hidden;
  margin-bottom: 1rem;
  background: var(--cream-deep);
}
.dest-card-img {
  width: 100%; height: 100%;
  object-fit: cover;
  transition: transform 0.7s var(--ease);
}
.dest-card:hover .dest-card-img { transform: scale(1.05); }
.dest-card-fallback {
  position: absolute; inset: 0;
  background-size: cover; background-position: center;
}
.dest-card-photo-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 50%, rgba(42,31,21,0.45) 100%);
  pointer-events: none;
}
.dest-card-overlay-content {
  position: absolute; bottom: 0.875rem; right: 1rem; left: 1rem;
  display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;
  color: var(--cream-soft);
}
.dest-card-overlay-num {
  font-family: 'Caveat', cursive;
  font-size: 1.25rem;
  opacity: 0.85;
}
.dest-card-overlay-emoji { font-size: 1.5rem; }

.dest-card-body { padding: 0 0.25rem; }
.dest-card-loc-en {
  font-family: 'Caveat', cursive;
  color: var(--gold-deep);
  font-size: 1rem;
  margin-bottom: 0.125rem;
  letter-spacing: 0.02em;
}
.dest-card-title {
  font-family: 'Markazi Text', serif;
  font-weight: 600;
  font-size: 1.875rem;
  line-height: 1.1;
  color: var(--ink);
  margin-bottom: 0.625rem;
}
.dest-card-meta {
  display: flex; align-items: center; gap: 0.5rem;
  color: var(--ink-mute);
  font-size: 0.875rem;
}
.dest-card-meta svg { flex-shrink: 0; opacity: 0.7; }
.dest-card-dates {
  margin-top: 0.5rem;
  font-size: 0.875rem;
  color: var(--ink-soft);
  font-weight: 500;
}
.dest-card-divider {
  height: 1px;
  background: linear-gradient(to left, transparent, var(--line-strong), transparent);
  margin: 0.75rem 0;
}
.dest-card-cta {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 0.625rem;
  font-size: 0.8125rem;
  color: var(--terracotta);
  font-weight: 500;
}
.dest-card-cta-arrow { transition: transform 0.3s var(--ease); }
.dest-card:hover .dest-card-cta-arrow { transform: translateX(-4px); }

/* =========================================================
   6. STICKY NOTES (home wall)
   ========================================================= */
.notes-section {
  padding: 4rem 0 6rem;
  background: linear-gradient(180deg, transparent, rgba(232,220,196,0.4) 30%, rgba(232,220,196,0.4) 70%, transparent);
}
.notes-wall {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 1.5rem;
  margin-top: 2rem;
}
@media (min-width: 640px) { .notes-wall { gap: 2rem; } }

.note {
  position: relative;
  padding: 1.5rem 1.25rem 1.25rem;
  min-height: 160px;
  border-radius: 4px;
  box-shadow: var(--shadow-photo);
  font-family: 'Caveat', 'Tajawal', cursive;
  font-size: 1.375rem;
  line-height: 1.4;
  color: var(--ink);
  display: flex; flex-direction: column;
  transition: transform 0.4s var(--ease), box-shadow 0.4s var(--ease);
  cursor: default;
}
.note:hover { transform: translateY(-4px) rotate(0deg) !important; box-shadow: var(--shadow-lg); z-index: 2; }

.note-yellow  { background: #F5E5A8; }
.note-pink    { background: #F2D5D0; }
.note-blue    { background: #D4DDE5; }
.note-mint    { background: #D5DDC8; }
.note-cream   { background: #EFE5D2; }

.notes-wall .note:nth-child(5n+1) { transform: rotate(-1.5deg); }
.notes-wall .note:nth-child(5n+2) { transform: rotate(1deg); }
.notes-wall .note:nth-child(5n+3) { transform: rotate(-0.5deg); }
.notes-wall .note:nth-child(5n+4) { transform: rotate(1.8deg); }
.notes-wall .note:nth-child(5n+5) { transform: rotate(-1deg); }

.note-tape {
  position: absolute;
  top: -8px; left: 50%;
  transform: translateX(-50%) rotate(-3deg);
  width: 3rem; height: 16px;
  background: rgba(255,255,255,0.45);
  border-left: 1px dashed rgba(42,31,21,0.08);
  border-right: 1px dashed rgba(42,31,21,0.08);
}
.note-text { flex: 1; word-break: break-word; }
.note-meta {
  margin-top: 0.5rem;
  font-family: 'Tajawal', sans-serif;
  font-size: 0.75rem;
  color: var(--ink-mute);
  opacity: 0.6;
  display: flex; justify-content: space-between; align-items: center;
}
.note-delete {
  opacity: 0; transition: opacity 0.2s ease;
  font-family: 'Tajawal', sans-serif; font-size: 0.75rem;
  color: var(--ink-mute);
}
.note:hover .note-delete { opacity: 1; }

.note-add {
  background: transparent;
  border: 2px dashed var(--line-strong);
  color: var(--ink-mute);
  font-family: 'Tajawal', sans-serif;
  font-size: 0.9375rem;
  cursor: pointer;
  transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem;
  box-shadow: none;
  transform: rotate(0deg) !important;
}
.note-add:hover { border-color: var(--terracotta); color: var(--terracotta); background: rgba(184,92,67,0.04); }
.note-add svg { opacity: 0.6; }

/* =========================================================
   7. TRIP DETAIL PAGE
   ========================================================= */
.detail-hero {
  position: relative;
  height: 60vh;
  min-height: 28rem;
  max-height: 36rem;
  overflow: hidden;
  background: var(--cream-deep);
}
.detail-hero-img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
}
.detail-hero-fallback { position: absolute; inset: 0; background-size: cover; background-position: center; }
.detail-hero-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(42,31,21,0.25) 0%, rgba(42,31,21,0.15) 30%, rgba(42,31,21,0.55) 100%);
}
.detail-hero-content {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  padding: 3rem 1.5rem 4rem;
  text-align: center;
  color: var(--cream-soft);
}
.detail-hero-back {
  position: absolute; top: 1.25rem; right: 1.25rem;
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.5rem 0.875rem;
  background: rgba(245,239,229,0.92);
  color: var(--ink);
  border-radius: 9999px;
  font-size: 0.8125rem; font-weight: 500;
  backdrop-filter: blur(10px);
  transition: background 0.2s ease;
}
.detail-hero-back:hover { background: var(--cream-soft); }
.detail-hero-supertitle {
  font-family: 'Caveat', cursive;
  font-size: 1.5rem;
  margin-bottom: 0.5rem;
  color: #F5E5A8;
  letter-spacing: 0.02em;
}
@media (min-width: 640px) { .detail-hero-supertitle { font-size: 2rem; } }
.detail-hero-title {
  font-family: 'Markazi Text', serif;
  font-weight: 600;
  font-size: 3rem;
  line-height: 1;
  margin-bottom: 0.875rem;
  text-shadow: 0 4px 24px rgba(0,0,0,0.4);
}
@media (min-width: 640px) { .detail-hero-title { font-size: 4.5rem; } }
@media (min-width: 1024px) { .detail-hero-title { font-size: 5.5rem; } }
.detail-hero-dates {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 1.125rem;
  color: rgba(250,246,238,0.92);
  letter-spacing: 0.05em;
}
@media (min-width: 640px) { .detail-hero-dates { font-size: 1.375rem; } }
.detail-hero-deco {
  margin-top: 1.5rem;
  display: flex; gap: 0.625rem; align-items: center;
  color: rgba(245,229,168,0.85);
  font-size: 0.875rem; letter-spacing: 0.5em;
}

/* Intro section */
.detail-intro {
  position: relative;
  margin-top: -3rem;
  z-index: 5;
  padding-bottom: 3rem;
}
.intro-card {
  background: var(--cream-soft);
  border-radius: var(--radius-lg);
  padding: 2rem 1.75rem;
  box-shadow: var(--shadow-lg);
  text-align: center;
  margin: 0 auto;
  max-width: 44rem;
}
@media (min-width: 640px) { .intro-card { padding: 2.75rem 2.5rem; } }
.intro-card-emoji { font-size: 2rem; margin-bottom: 0.75rem; }
.intro-card-text {
  font-family: 'Markazi Text', serif;
  font-size: 1.375rem;
  line-height: 1.7;
  color: var(--ink);
}
@media (min-width: 640px) { .intro-card-text { font-size: 1.625rem; line-height: 1.6; } }

/* Summary chips */
.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 1rem;
  max-width: 44rem;
  margin: 2rem auto 0;
}
@media (min-width: 640px) { .summary-grid { grid-template-columns: repeat(4, 1fr); gap: 1.25rem; } }
.summary-item {
  display: flex; flex-direction: column; align-items: center;
  padding: 1.125rem 0.75rem;
  background: var(--paper);
  border-radius: var(--radius-md);
  text-align: center;
  border: 1px solid var(--line);
}
.summary-icon { color: var(--gold-deep); margin-bottom: 0.4rem; }
.summary-label {
  font-size: 0.6875rem;
  color: var(--ink-mute);
  letter-spacing: 0.1em;
  margin-bottom: 0.25rem;
  text-transform: uppercase;

function loadFromStorage(key, fallback) {
  try {
    const stored = localStorage.getItem(key);
    if (stored) return JSON.parse(stored);
  } catch (e) { /* ignore */ }
  try { localStorage.setItem(key, JSON.stringify(fallback)); } catch (e) {}
  return JSON.parse(JSON.stringify(fallback));
}
function saveToStorage(key, data) {
  try { localStorage.setItem(key, JSON.stringify(data)); }
  catch (e) { console.warn('Storage write failed:', e); }
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function newId() { return 'x_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7); }

// ---------- HERO with image-masked letters ----------
function renderHero() {
  // "Israa" / "&" / "Muataz" — each letter has a destination photo masked
  // Letters indexed: 0-4 = "Israa", 5-10 = "Muataz" (skip ampersand visually)
  const lettersIsraa = ['I', 's', 'r', 'a', 'a'];
  const lettersMuataz = ['M', 'u', 'a', 't', 'a', 'z'];
  let photoIdx = 0;
  const renderLetter = (l) => {
    const photoId = HERO_LETTER_PHOTOS[photoIdx % HERO_LETTER_PHOTOS.length];
    photoIdx++;
    const url = IMG(photoId, 600);
    return '<span class="letter" style="background-image:url(' + url + ');">' + l + '</span>';
  };

  return '' +
  '<section class="hero fade-in">' +
    '<div class="hero-supertitle">our travel journal</div>' +
    '<div class="hero-arabic-intro">— مذكّرات سفر —</div>' +
    '<h1 class="hero-title" dir="ltr" aria-label="Israa and Muataz">' +
      '<div class="hero-title-line">' + lettersIsraa.map(renderLetter).join('') + '</div>' +
      '<div class="hero-title-line hero-title-line-amp">&amp;</div>' +
      '<div class="hero-title-line">' + lettersMuataz.map(renderLetter).join('') + '</div>' +
    '</h1>' +
    '<p class="hero-subtitle">سبعةُ أسفار، آلافُ الذكريات، ولحظاتٌ لا يكفيها كتاب.</p>' +
    '<div class="hero-decoration" aria-hidden="true">' +
      '<span class="hero-decoration-line"></span>' +
      '<span class="hero-decoration-dot"></span>' +
      '<span>◇</span>' +

// ---------- TRIP DETAIL ----------
function renderTripDetail(trip) {
  return '' +

    renderDetailHero(trip) +

    renderToc(trip) +
    renderMemoriesSection(trip) +

    renderStaysSection(trip) +
    renderFoodSection(trip) +
    renderActivitiesSection(trip) +

function renderDetailHero(trip) {
  return '' +
  '<section class="detail-hero">' +
    '<img class="detail-hero-img" src="' + esc(trip.coverImage) + '" alt="' + esc(trip.titleAr) + '" onerror="this.style.display=\'none\'">' +

    '</button>' +

      '<div class="detail-hero-supertitle">' + esc(trip.titleEn) + '</div>' +
      '<h1 class="detail-hero-title">' + esc(trip.titleAr) + '</h1>' +
      '<div class="detail-hero-dates">' + esc(trip.dateStart) + ' — ' + esc(trip.dateEnd) + '</div>' +
      '<div class="detail-hero-deco">✦ ✦ ✦</div>' +

function renderDetailIntro(trip) {

function renderSummaryGrid(trip) {
  const s = trip.summary || {};
  return '' +
  '<div class="summary-grid">' +

function summaryItem(icon, label, value) {
  return '<div class="summary-item">' +
    '<div class="summary-icon">' + icon + '</div>' +
    '<div class="summary-label">' + esc(label) + '</div>' +

}

function renderToc(trip) {
  const counts = {
    memories: (trip.memories || []).length,
    places: (trip.places || []).length,
    stays: (trip.stays || []).length,
    food: (trip.food || []).length,
    activities: (trip.activities || []).length,
    feelings: trip.feelings ? 1 : 0,
    tips: (trip.tips || []).length,
  };
  return '' +
  '<section class="toc-section container">' +
    '<div class="toc-card">' +
      '<h3 class="toc-title">TRAVEL JOURNAL</h3>' +
      '<div class="toc-title-ar">دفتر الرحلة</div>' +
      '<div class="toc-list">' +
        SECTIONS.map(function(sec){
          const count = counts[sec.key];
          const countText = count ? '· ' + count : '';
          return '<button class="toc-item" data-action="scroll-to" data-target="section-' + sec.key + '">' +
            '<span class="toc-item-icon">' + sec.icon + '</span>' +
            '<span class="toc-item-text">' + esc(sec.ar) + '</span>' +
            '<span class="toc-item-count">' + countText + '</span>' +
          '</button>';
        }).join('') +
      '</div>' +
    '</div>' +
  '</section>';
}

  '</div>';

// ---------- MODAL: Add Note ----------
function renderAddNoteModal() {
  const f = state.addNoteForm;
  return '' +
  '<div class="modal-overlay" data-modal="overlay">' +
    '<div class="modal">' +
      '<button class="modal-close" data-action="close-modal" aria-label="إغلاق">' + ICONS.x + '</button>' +
      '<h3 class="modal-title">ملاحظة جديدة</h3>' +
      '<div class="modal-form">' +
        '<div class="field-group">' +
          '<label class="field-label">النص</label>' +
          '<textarea class="input-field" data-form="addNoteForm" data-field="text" rows="4" placeholder="اكتب ذكرى، اقتباس، أو نصيحة سفر...">' + esc(f.text) + '</textarea>' +
        '</div>' +
        '<div class="field-group">' +
          '<label class="field-label">لون الورقة</label>' +
          '<div class="color-picker">' +
            NOTE_COLORS.map(function(c){
              const isActive = f.color === c ? 'active' : '';
              return '<button type="button" class="color-swatch ' + isActive + ' note-' + c + '" data-action="select-note-color" data-value="' + c + '" aria-label="' + c + '"></button>';
            }).join('') +
          '</div>' +
        '</div>' +
        '<div class="modal-form-actions">' +
          '<button class="btn btn-primary btn-flex" data-action="save-note">أضف الملاحظة</button>' +
          '<button class="btn-cancel" data-action="close-modal">إلغاء</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

// ---------- APP SHELL ----------
function renderApp() {
  let main = '';
  if (state.view === 'home') {
    main = renderHero() + renderDestinationsSection() + renderNotesSection();
  } else if (state.view === 'detail') {
    const trip = state.trips.find(function(t){ return t.id === state.currentTripId; });
    if (trip) main = renderTripDetail(trip);
    else main = '<div class="empty-state">الرحلة غير موجودة</div>';
  }
  return renderTopNav() + '<main>' + main + '</main>' + renderFooter() +
    (state.showAddNote ? renderAddNoteModal() : '');
}

function render() {
  document.getElementById('app').innerHTML = renderApp();
  document.body.style.overflow = state.showAddNote ? 'hidden' : '';
}

/* =========================================================
   ACTIONS
   ========================================================= */
function openTrip(id) {
  state.currentTripId = id;
  state.view = 'detail';
  render();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function goHome() {
  state.view = 'home';
  state.currentTripId = null;
  render();
  window.scrollTo({ top: 0, behavior: 'auto' });
}

function scrollToTarget(targetId) {
  setTimeout(function(){
    const el = document.getElementById(targetId);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 50);
}

function showAddNote() {
  state.showAddNote = true;
  state.addNoteForm = initialAddNoteForm();
  render();
}
function closeModal() {
  state.showAddNote = false;
  render();
}
function saveNote() {
  const f = state.addNoteForm;
  if (!f.text.trim()) { alert('من فضلك اكتب نص الملاحظة'); return; }
  const note = {
    id: newId(),
    text: f.text.trim(),
    color: f.color || 'yellow',
    createdAt: Date.now(),
  };
  state.notes = [note].concat(state.notes);
  state.showAddNote = false;
  saveToStorage(STORAGE_KEY_NOTES, state.notes);
  render();
}
function deleteNote(id) {
  if (!confirm('حذف هذه الملاحظة؟')) return;
  state.notes = state.notes.filter(function(n){ return n.id !== id; });
  saveToStorage(STORAGE_KEY_NOTES, state.notes);
  render();
}
function selectNoteColor(color) {
  state.addNoteForm.color = color;
  render();
}

/* =========================================================
   EVENT DELEGATION
   ========================================================= */
function handleClick(e) {
  // Overlay click closes modal
  if (e.target.dataset && e.target.dataset.modal === 'overlay') {
    closeModal(); return;
  }
  const target = e.target.closest('[data-action]');
  if (!target) return;

  const action = target.dataset.action;
  const id = target.dataset.id;
  const value = target.dataset.value;
  const tgtTarget = target.dataset.target;

  switch (action) {
    case 'go-home': goHome(); break;
    case 'open-trip': openTrip(id); break;
    case 'scroll-to': scrollToTarget(tgtTarget); break;
    case 'show-add-note': showAddNote(); break;
    case 'close-modal': closeModal(); break;
    case 'save-note': saveNote(); break;
    case 'delete-note': deleteNote(id); break;
    case 'select-note-color': selectNoteColor(value); break;
  }
}

function handleInput(e) {
  const form = e.target.dataset.form;
  const field = e.target.dataset.field;
  if (form && field && state[form]) {
    // Silent update — no re-render so input keeps focus
    state[form][field] = e.target.value;
  }
}

function handleKeydown(e) {
  if (e.key === 'Escape' && state.showAddNote) closeModal();
}

/* =========================================================
   INIT
   ========================================================= */
function init() {
  state.trips = loadFromStorage(STORAGE_KEY_TRIPS, SAMPLE_TRIPS);
  state.notes = loadFromStorage(STORAGE_KEY_NOTES, SAMPLE_NOTES);
  const app = document.getElementById('app');
  app.addEventListener('click', handleClick);
  app.addEventListener('input', handleInput);
  document.addEventListener('keydown', handleKeydown);
  render();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
