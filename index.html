<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>إسراء ومُعتَز · مذكرات سفر</title>
<meta name="description" content="مذكّرات سفر — رحلات إسراء ومُعتَز حول العالم">
<meta name="theme-color" content="#F5EFE5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
<!-- Curated font alternatives — preloaded so users can switch in Settings without dynamic loading -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Oswald:wght@400;700&family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lora:ital,wght@0,400;0,500;0,700;1,400&family=Caveat:wght@400;600;700&family=Dancing+Script:wght@400;700&family=Sacramento&family=Markazi+Text:wght@400;500;600;700&family=Amiri:ital,wght@0,400;0,700;1,400&family=Reem+Kufi:wght@400;500;600;700&family=Tajawal:wght@200;300;400;500;700;900&family=Cairo:wght@300;400;600;700&family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<style>
/* =========================================================
   1. BASE & DESIGN TOKENS (CSS Variables for dynamic theming)
   ========================================================= */
:root {
  /* Warm beige & sand palette — overridable from JS */
  --cream:        #F5EFE5;
  --cream-warm:   #EFE5D2;
  --cream-soft:   #FAF6EE;
  --cream-deep:   #E8DCC4;
  --sand:         #DCC9A8;
  --paper:        #FBF7EF;

  --ink:          #2A1F15;
  --ink-soft:     #4A3B2C;
  --ink-mute:     #8A7A65;
  --ink-light:    #B8A88E;

  --gold:         #C9A961;
  --gold-deep:    #A8893D;
  --terracotta:   #B85C43;
  --rust:         #8E3F2C;
  --moss:         #6B7A4E;
  --slate-blue:   #7B96A8;

  --line:         rgba(42,31,21,0.10);
  --line-strong:  rgba(42,31,21,0.20);

  --shadow-sm:    0 2px 8px rgba(42,31,21,0.06);
  --shadow-md:    0 8px 24px rgba(42,31,21,0.10);
  --shadow-lg:    0 20px 48px rgba(42,31,21,0.14);
  --shadow-photo: 0 6px 20px rgba(42,31,21,0.18), 0 2px 4px rgba(42,31,21,0.08);

  --radius-sm:    8px;
  --radius-md:    14px;
  --radius-lg:    20px;
  --radius-xl:    28px;

  --ease:         cubic-bezier(.2,.7,.2,1);

  /* Fonts — overridable from JS for dynamic font switching */
  --font-body:        'Tajawal', system-ui, sans-serif;
  --font-display:     'Markazi Text', 'Amiri', serif;
  --font-en-display:  'Playfair Display', Georgia, serif;
  --font-en-script:   'Caveat', cursive;
  --font-hero:        'Anton', 'Archivo Black', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--cream); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.6;
  background-image:
    radial-gradient(at 20% 10%, rgba(201,169,97,0.05) 0%, transparent 50%),
    radial-gradient(at 80% 90%, rgba(184,92,67,0.04) 0%, transparent 50%);
  background-attachment: fixed;
}

button { background: none; border: none; cursor: pointer; font-family: inherit; color: inherit; font-size: inherit; padding: 0; text-align: inherit; }
input, textarea, select { font-family: inherit; }
a { color: inherit; text-decoration: none; cursor: pointer; }
img, svg { display: block; max-width: 100%; }
img { height: auto; }

.display      { font-family: var(--font-display); line-height: 1.15; }
.display-en   { font-family: var(--font-en-display); }
.script-en    { font-family: var(--font-en-script); }

::selection { background: var(--gold); color: var(--ink); }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }

/* =========================================================
   2. LAYOUT
   ========================================================= */
.container { max-width: 78rem; margin: 0 auto; padding: 0 1.25rem; }
@media (min-width: 640px) { .container { padding: 0 2rem; } }
@media (min-width: 1024px) { .container { padding: 0 3rem; } }
.container-narrow { max-width: 56rem; margin: 0 auto; padding: 0 1.25rem; }
@media (min-width: 640px) { .container-narrow { padding: 0 2rem; } }

/* =========================================================
   3. LOGIN SCREEN
   ========================================================= */
.login-screen {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 2rem 1.25rem;
  position: relative;
  overflow: hidden;
}
.login-screen::before {
  content: '';
  position: absolute; inset: 0;
  background-image:
    radial-gradient(at 30% 20%, rgba(201,169,97,0.18) 0%, transparent 45%),
    radial-gradient(at 70% 80%, rgba(184,92,67,0.12) 0%, transparent 45%);
  pointer-events: none;
}
.login-card {
  position: relative;
  background: var(--cream-soft);
  border-radius: var(--radius-xl);
  padding: 2.5rem 1.75rem;
  width: 100%;
  max-width: 26rem;
  box-shadow: var(--shadow-lg);
  text-align: center;
  border: 1px solid var(--line);
}
@media (min-width: 640px) { .login-card { padding: 3rem 2.5rem; } }
.login-supertitle {
  font-family: var(--font-en-script);
  font-size: 1.5rem;
  color: var(--gold-deep);
  margin-bottom: 0.25rem;
  letter-spacing: 0.02em;
}
.login-title {
  font-family: var(--font-display);
  font-size: 2.5rem;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.1;
  margin-bottom: 0.5rem;
}
.login-subtitle {
  font-family: var(--font-display);
  font-size: 1.0625rem;
  color: var(--ink-mute);
  margin-bottom: 2rem;
}
.login-deco {
  display: flex; align-items: center; justify-content: center; gap: 0.75rem;
  color: var(--gold-deep);
  margin: 0 auto 2rem;
  max-width: 12rem;
}
.login-deco-line { flex: 1; height: 1px; background: currentColor; opacity: 0.3; }
.login-form { text-align: right; }
.login-label {
  display: block;
  font-size: 0.875rem;
  color: var(--ink-soft);
  margin-bottom: 0.5rem;
  font-weight: 500;
}
.password-wrap {
  position: relative;
  display: flex;
}
.password-input {
  width: 100%;
  background: var(--paper);
  border: 1px solid var(--line-strong);
  color: var(--ink);
  padding: 0.875rem 3rem 0.875rem 1rem;
  border-radius: var(--radius-md);
  font-size: 1rem;
  line-height: 1.4;
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
  letter-spacing: 0.03em;
  font-family: var(--font-body);
}
.password-input:focus {
  outline: none;
  border-color: var(--gold-deep);
  box-shadow: 0 0 0 3px rgba(201,169,97,0.15);
}
.password-toggle {
  position: absolute;
  left: 0.625rem; top: 50%;
  transform: translateY(-50%);
  width: 2.25rem; height: 2.25rem;
  border-radius: 9999px;
  display: flex; align-items: center; justify-content: center;
  color: var(--ink-mute);
  transition: color 0.2s ease, background 0.2s ease;
}
.password-toggle:hover { color: var(--ink); background: var(--cream-warm); }
.login-error {
  margin-top: 0.75rem;
  font-size: 0.875rem;
  color: var(--terracotta);
  min-height: 1.25rem;
  text-align: center;
}
.login-submit {
  width: 100%;
  margin-top: 1.25rem;
  padding: 0.875rem 1.5rem;
  border-radius: var(--radius-md);
  background: var(--ink);
  color: var(--cream-soft);
  font-size: 1rem;
  font-weight: 500;
  letter-spacing: 0.02em;
  transition: background 0.2s ease, transform 0.2s ease;
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
}
.login-submit:hover { background: var(--terracotta); }
.login-submit:active { transform: translateY(1px); }
.login-submit:disabled { opacity: 0.6; cursor: not-allowed; }
.login-footer {
  margin-top: 2rem;
  font-size: 0.8125rem;
  color: var(--ink-light);
  font-family: var(--font-en-script);
  font-size: 1.125rem;
}

/* =========================================================
   4. NAVIGATION
   ========================================================= */
.nav {
  position: sticky; top: 0; z-index: 40;
  background: rgba(245,239,229,0.88);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid var(--line);
}
.nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; padding: 0.875rem 0; }
.nav-logo { display: flex; align-items: center; gap: 0.625rem; }
.nav-logo-name { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; color: var(--ink); letter-spacing: -0.01em; }
@media (min-width: 640px) { .nav-logo-name { font-size: 1.75rem; } }
.nav-logo-en { font-family: var(--font-en-script); font-size: 1.125rem; color: var(--gold-deep); margin-bottom: -0.25rem; display: none; }
@media (min-width: 768px) { .nav-logo-en { display: inline; } }

.nav-actions { display: flex; align-items: center; gap: 0.625rem; }
.nav-links { display: flex; align-items: center; gap: 1rem; font-size: 0.875rem; color: var(--ink-soft); }
@media (min-width: 640px) { .nav-links { gap: 1.5rem; font-size: 0.9375rem; } }
.nav-link { position: relative; transition: color 0.2s ease; padding-bottom: 4px; }
.nav-link::after { content: ''; position: absolute; right: 0; left: 0; bottom: -2px; height: 1px; background: var(--terracotta); transform: scaleX(0); transform-origin: right; transition: transform 0.3s var(--ease); }
.nav-link:hover::after, .nav-link.active::after { transform: scaleX(1); }
.nav-link:hover, .nav-link.active { color: var(--ink); }

.nav-icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 2.25rem; height: 2.25rem; border-radius: 9999px;
  color: var(--ink-soft); transition: background 0.2s ease, color 0.2s ease;
}
.nav-icon-btn:hover { background: var(--cream-warm); color: var(--ink); }
.nav-icon-btn.active { background: var(--ink); color: var(--cream-soft); }

.nav-add-btn {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.5rem 0.875rem; border-radius: 9999px;
  background: var(--ink); color: var(--cream-soft); font-size: 0.8125rem; font-weight: 500;
  transition: background 0.2s ease, transform 0.2s ease;
}
.nav-add-btn:hover { background: var(--terracotta); }
.nav-add-btn:active { transform: translateY(1px); }
.hidden-md { display: none; }
@media (min-width: 768px) { .hidden-md { display: inline-block; } }

/* Edit mode badge in nav */
.edit-mode-badge {
  display: inline-flex; align-items: center; gap: 0.4rem;
  padding: 0.375rem 0.75rem;
  background: var(--terracotta);
  color: var(--cream-soft);
  border-radius: 9999px;
  font-size: 0.75rem;
  font-weight: 500;
  animation: pulse-soft 2s infinite;
}
@keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; } }

/* =========================================================
   5. EDIT MODE — affordances on top of regular UI
   ========================================================= */
body.edit-mode .edit-affordance { display: inline-flex; }
.edit-affordance { display: none; }

/* Edit overlay on destination cards */
.dest-card-edit-overlay {
  position: absolute;
  top: 0.5rem; left: 0.5rem;
  display: none;
  gap: 0.375rem;
  z-index: 5;
}
body.edit-mode .dest-card-edit-overlay { display: flex; }
.dest-card-edit-btn {
  width: 2.25rem; height: 2.25rem;
  border-radius: 9999px;
  background: rgba(245,239,229,0.95);
  color: var(--ink);
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-sm);
  transition: background 0.2s ease, transform 0.2s ease;
  backdrop-filter: blur(8px);
}
.dest-card-edit-btn:hover { background: var(--cream-soft); transform: scale(1.08); }
.dest-card-edit-btn.danger { color: var(--rust); }
.dest-card-edit-btn.danger:hover { background: var(--rust); color: var(--cream-soft); }

/* "Add" affordance card (for adding new destinations) */
.dest-add-card {
  display: none;
  background: transparent;
  border: 2px dashed var(--line-strong);
  border-radius: var(--radius-md);
  min-height: 320px;
  align-items: center; justify-content: center;
  flex-direction: column;
  gap: 0.75rem;
  color: var(--ink-mute);
  font-family: var(--font-display);
  font-size: 1.25rem;
  cursor: pointer;
  transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
}
body.edit-mode .dest-add-card { display: flex; }
.dest-add-card:hover { border-color: var(--terracotta); color: var(--terracotta); background: rgba(184,92,67,0.04); }

/* Edit button in detail view */
.detail-edit-fab {
  display: none;
  position: fixed;
  bottom: 1.5rem; left: 1.5rem;
  z-index: 30;
  align-items: center; gap: 0.5rem;
  padding: 0.75rem 1.25rem;
  border-radius: 9999px;
  background: var(--ink);
  color: var(--cream-soft);
  font-size: 0.9375rem; font-weight: 500;
  box-shadow: var(--shadow-lg);
  transition: background 0.2s ease, transform 0.2s ease;
}
body.edit-mode .detail-edit-fab { display: inline-flex; }
.detail-edit-fab:hover { background: var(--terracotta); }
.detail-edit-fab:active { transform: translateY(1px); }

/* Note edit/delete buttons (made visible in edit mode) */
body.edit-mode .note-delete { opacity: 0.6 !important; }
.note-edit-btn {
  display: none;
  position: absolute; top: 6px; right: 6px;
  width: 1.75rem; height: 1.75rem;
  border-radius: 9999px;
  background: rgba(255,255,255,0.6);
  color: var(--ink-soft);
  align-items: center; justify-content: center;
  font-size: 0.875rem;
  transition: background 0.2s ease;
}
body.edit-mode .note-edit-btn { display: inline-flex; }
.note-edit-btn:hover { background: rgba(255,255,255,0.9); color: var(--ink); }

/* =========================================================
   6. HERO
   ========================================================= */
.hero { position: relative; padding: 3.5rem 1.25rem 5rem; text-align: center; overflow: hidden; }
@media (min-width: 640px) { .hero { padding: 5rem 2rem 6rem; } }
@media (min-width: 1024px) { .hero { padding: 6rem 3rem 7rem; } }

.hero-supertitle { font-family: var(--font-en-script); font-size: 1.5rem; color: var(--gold-deep); margin-bottom: 0.5rem; letter-spacing: 0.02em; }
@media (min-width: 640px) { .hero-supertitle { font-size: 1.875rem; } }
.hero-arabic-intro { font-family: var(--font-display); font-size: 1.125rem; color: var(--ink-soft); margin-bottom: 2.5rem; letter-spacing: 0.02em; }
@media (min-width: 640px) { .hero-arabic-intro { font-size: 1.375rem; margin-bottom: 3rem; } }

.hero-title {
  font-family: var(--font-hero);
  font-weight: 400;
  line-height: 0.88;
  letter-spacing: 0.01em;
  color: var(--ink);
  display: flex; flex-direction: column; align-items: center; gap: 0.05em;
  margin-bottom: 2.25rem;
}
.hero-title-line { display: inline-flex; align-items: center; justify-content: center; font-size: clamp(4.5rem, 18vw, 11rem); }
.hero-title-line-amp { font-family: var(--font-en-display); font-style: italic; font-weight: 400; font-size: clamp(2.75rem, 10vw, 6rem); color: var(--gold-deep); line-height: 1; }

.letter {
  display: inline-block;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  -webkit-text-fill-color: transparent;
  transition: transform 0.4s var(--ease), filter 0.4s ease;
  padding: 0 0.005em;
}
.letter:hover { transform: translateY(-4px); filter: brightness(1.1) saturate(1.15); }
@supports not ((-webkit-background-clip: text) or (background-clip: text)) {
  .letter { color: var(--terracotta); -webkit-text-fill-color: var(--terracotta); background: none !important; }
}

.hero-subtitle { font-family: var(--font-display); font-size: 1.25rem; color: var(--ink-soft); max-width: 36rem; margin: 0 auto; line-height: 1.6; }
@media (min-width: 640px) { .hero-subtitle { font-size: 1.5rem; } }

.hero-decoration { display: flex; align-items: center; justify-content: center; gap: 1rem; margin: 1.75rem auto 0; color: var(--gold-deep); }
.hero-decoration-line { width: 3rem; height: 1px; background: var(--gold); opacity: 0.5; }
.hero-decoration-dot { width: 4px; height: 4px; border-radius: 9999px; background: var(--gold-deep); }

/* =========================================================
   7. DESTINATIONS GRID
   ========================================================= */
.destinations-section { padding: 2rem 0 6rem; position: relative; }

.section-heading { display: flex; flex-direction: column; align-items: center; text-align: center; margin-bottom: 3rem; gap: 0.5rem; }
.section-heading-en { font-family: var(--font-en-script); font-size: 1.5rem; color: var(--gold-deep); }
.section-heading-ar { font-family: var(--font-display); font-size: 2.25rem; font-weight: 600; color: var(--ink); line-height: 1.1; }
@media (min-width: 640px) { .section-heading-ar { font-size: 3rem; } }
.section-heading-sub { font-size: 0.9375rem; color: var(--ink-mute); margin-top: 0.25rem; max-width: 30rem; }
.section-heading-deco { display: flex; align-items: center; gap: 0.625rem; margin-top: 0.75rem; color: var(--gold-deep); }
.section-heading-deco-line { width: 2.5rem; height: 1px; background: currentColor; opacity: 0.4; }

.destinations-grid { display: grid; grid-template-columns: 1fr; gap: 2.5rem 1.75rem; }
@media (min-width: 640px) { .destinations-grid { grid-template-columns: repeat(2, 1fr); } }
@media (min-width: 1024px) { .destinations-grid { grid-template-columns: repeat(3, 1fr); gap: 3rem 2rem; } }

.dest-card {
  position: relative;
  cursor: pointer;
  display: flex; flex-direction: column;
  background: var(--paper);
  padding: 0.875rem 0.875rem 1.25rem;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-photo);
  transition: transform 0.5s var(--ease), box-shadow 0.5s var(--ease);
  text-align: right;
  width: 100%;
}
@media (min-width: 640px) {
  .destinations-grid > .dest-card:nth-child(3n+1) { transform: rotate(-0.4deg); }
  .destinations-grid > .dest-card:nth-child(3n+2) { transform: rotate(0.3deg); }
  .destinations-grid > .dest-card:nth-child(3n+3) { transform: rotate(-0.2deg); }
}
.dest-card:hover { transform: translateY(-8px) rotate(0deg); box-shadow: var(--shadow-lg); }
.dest-card:focus-visible { transform: translateY(-8px) rotate(0deg); }
.dest-card-tape {
  position: absolute; top: -10px; left: 50%;
  transform: translateX(-50%) rotate(-2deg);
  width: 3.5rem; height: 18px;
  background: rgba(201,169,97,0.5);
  border-radius: 2px;
  box-shadow: 0 1px 3px rgba(42,31,21,0.1);
  pointer-events: none;
}
.dest-card:nth-child(2n) .dest-card-tape { background: rgba(184,92,67,0.45); transform: translateX(-50%) rotate(2deg); }
.dest-card:nth-child(3n) .dest-card-tape { background: rgba(123,150,168,0.45); }

.dest-card-photo { position: relative; aspect-ratio: 4/5; border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 1rem; background: var(--cream-deep); }
.dest-card-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.7s var(--ease); }
.dest-card:hover .dest-card-img { transform: scale(1.05); }
.dest-card-photo-overlay { position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(42,31,21,0.45) 100%); pointer-events: none; }
.dest-card-overlay-content { position: absolute; bottom: 0.875rem; right: 1rem; left: 1rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; color: var(--cream-soft); }
.dest-card-overlay-num { font-family: var(--font-en-script); font-size: 1.25rem; opacity: 0.85; }
.dest-card-overlay-emoji { font-size: 1.5rem; }

.dest-card-body { padding: 0 0.25rem; }
.dest-card-loc-en { font-family: var(--font-en-script); color: var(--gold-deep); font-size: 1rem; margin-bottom: 0.125rem; letter-spacing: 0.02em; }
.dest-card-title { font-family: var(--font-display); font-weight: 600; font-size: 1.875rem; line-height: 1.1; color: var(--ink); margin-bottom: 0.625rem; }
.dest-card-meta { display: flex; align-items: center; gap: 0.5rem; color: var(--ink-mute); font-size: 0.875rem; }
.dest-card-meta svg { flex-shrink: 0; opacity: 0.7; }
.dest-card-divider { height: 1px; background: linear-gradient(to left, transparent, var(--line-strong), transparent); margin: 0.75rem 0; }
.dest-card-cta { display: flex; align-items: center; justify-content: space-between; margin-top: 0.625rem; font-size: 0.8125rem; color: var(--terracotta); font-weight: 500; }
.dest-card-cta-arrow { transition: transform 0.3s var(--ease); }
.dest-card:hover .dest-card-cta-arrow { transform: translateX(-4px); }

/* =========================================================
   8. STICKY NOTES
   ========================================================= */
.notes-section { padding: 4rem 0 6rem; background: linear-gradient(180deg, transparent, rgba(232,220,196,0.4) 30%, rgba(232,220,196,0.4) 70%, transparent); }
.notes-wall { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
@media (min-width: 640px) { .notes-wall { gap: 2rem; } }

.note {
  position: relative;
  padding: 1.5rem 1.25rem 1.25rem;
  min-height: 160px;

}
.note:hover { transform: translateY(-4px) rotate(0deg) !important; box-shadow: var(--shadow-lg); z-index: 2; }

.note-yellow  { background: #F5E5A8; }
.note-pink    { background: #F2D5D0; }
.note-blue    { background: #D4DDE5; }
.note-mint    { background: #D5DDC8; }

.notes-wall .note:nth-child(5n+1) { transform: rotate(-1.5deg); }
.notes-wall .note:nth-child(5n+2) { transform: rotate(1deg); }
.notes-wall .note:nth-child(5n+3) { transform: rotate(-0.5deg); }

.note-tape { position: absolute; top: -8px; left: 50%; transform: translateX(-50%) rotate(-3deg); width: 3rem; height: 16px; background: rgba(255,255,255,0.45); border-left: 1px dashed rgba(42,31,21,0.08); border-right: 1px dashed rgba(42,31,21,0.08); }
.note-text { flex: 1; word-break: break-word; }
.note-meta { margin-top: 0.5rem; font-family: var(--font-body); font-size: 0.75rem; color: var(--ink-mute); opacity: 0.6; display: flex; justify-content: space-between; align-items: center; }
.note-delete { opacity: 0; transition: opacity 0.2s ease; font-family: var(--font-body); font-size: 0.75rem; color: var(--ink-mute); }
.note:hover .note-delete { opacity: 1; }

.note-add { background: transparent; border: 2px dashed var(--line-strong); color: var(--ink-mute); font-family: var(--font-body); font-size: 0.9375rem; cursor: pointer; transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem; box-shadow: none; transform: rotate(0deg) !important; }

/* =========================================================

.detail-hero-content { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding: 3rem 1.5rem 4rem; text-align: center; color: var(--cream-soft); }
.detail-hero-back { position: absolute; top: 1.25rem; right: 1.25rem; display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 0.875rem; background: rgba(245,239,229,0.92); color: var(--ink); border-radius: 9999px; font-size: 0.8125rem; font-weight: 500; backdrop-filter: blur(10px); transition: background 0.2s ease; }

.detail-hero-dates { font-family: var(--font-en-display); font-style: italic; font-size: 1.125rem; color: rgba(250,246,238,0.92); letter-spacing: 0.05em; }
@media (min-width: 640px) { .detail-hero-dates { font-size: 1.375rem; } }

.detail-intro { position: relative; margin-top: -3rem; z-index: 5; padding-bottom: 3rem; }
.intro-card { background: var(--cream-soft); border-radius: var(--radius-lg); padding: 2rem 1.75rem; box-shadow: var(--shadow-lg); text-align: center; margin: 0 auto; max-width: 44rem; }
@media (min-width: 640px) { .intro-card { padding: 2.75rem 2.5rem; } }
.intro-card-emoji { font-size: 2rem; margin-bottom: 0.75rem; }
.intro-card-text { font-family: var(--font-display); font-size: 1.375rem; line-height: 1.7; color: var(--ink); }
@media (min-width: 640px) { .intro-card-text { font-size: 1.625rem; line-height: 1.6; } }

.summary-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; max-width: 44rem; margin: 2rem auto 0; }

.summary-item { display: flex; flex-direction: column; align-items: center; padding: 1.125rem 0.75rem; background: var(--paper); border-radius: var(--radius-md); text-align: center; border: 1px solid var(--line); }

.toc-section { padding: 2rem 0 4rem; }

.toc-title { font-family: var(--font-en-display); font-size: 1.5rem; text-align: center; margin-bottom: 0.25rem; color: var(--ink); letter-spacing: 0.02em; }
.toc-title-ar { text-align: center; font-family: var(--font-en-script); font-size: 1.125rem; color: var(--gold-deep); margin-bottom: 1.25rem; }
.toc-list { display: flex; flex-direction: column; gap: 0.25rem; }
.toc-item { display: flex; align-items: center; gap: 0.875rem; padding: 0.75rem 0.875rem; border-radius: var(--radius-sm); font-size: 0.9375rem; color: var(--ink); transition: background 0.2s ease, color 0.2s ease; cursor: pointer; width: 100%; text-align: right; }
.toc-item:hover { background: var(--cream-warm); color: var(--terracotta); }
.toc-item-icon { width: 2rem; height: 2rem; border-radius: 9999px; background: var(--cream-warm); color: var(--gold-deep); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.toc-item:hover .toc-item-icon { background: var(--terracotta); color: var(--cream-soft); }
.toc-item-text { font-family: var(--font-display); font-size: 1.125rem; font-weight: 500; }
.toc-item-count { margin-inline-start: auto; font-size: 0.75rem; color: var(--ink-light); font-family: var(--font-body); }

.content-section { padding: 3rem 0; scroll-margin-top: 5rem; }
.content-section:nth-child(even) { background: rgba(232,220,196,0.25); }
.section-label-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 2rem; max-width: 56rem; margin-inline: auto; padding: 0 1.25rem; }
.section-label-icon { width: 2.75rem; height: 2.75rem; border-radius: 9999px; background: var(--cream-warm); color: var(--gold-deep); display: flex; align-items: center; justify-content: center; flex-shrink: 0; border: 1px solid var(--line); }
.section-label-text { flex: 1; }
.section-label-en { font-family: var(--font-en-script); font-size: 1.25rem; color: var(--gold-deep); line-height: 1; margin-bottom: 0.125rem; }
.section-label-ar { font-family: var(--font-display); font-size: 1.875rem; font-weight: 600; color: var(--ink); line-height: 1.1; }
.section-label-line { flex: 1; height: 1px; background: linear-gradient(to left, var(--line-strong), transparent); min-width: 2rem; }

.memories-layout { display: grid; gap: 1.5rem; max-width: 64rem; margin: 0 auto; padding: 0 1.25rem; }
@media (min-width: 768px) { .memories-layout { grid-template-columns: 1.4fr 1fr; gap: 2rem; } }
.memory-featured { position: relative; background: var(--paper); padding: 0.75rem 0.75rem 1.25rem; border-radius: var(--radius-md); box-shadow: var(--shadow-photo); }
.memory-featured-photo { aspect-ratio: 4/3; border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 0.875rem; background: var(--cream-deep); position: relative; }
.memory-featured-photo img { width: 100%; height: 100%; object-fit: cover; }
.memory-featured-caption { font-family: var(--font-en-script); font-size: 1.375rem; text-align: center; color: var(--ink-soft); padding: 0 0.5rem; }
.memory-featured-story { margin-top: 0.875rem; font-family: var(--font-display); font-size: 1.125rem; line-height: 1.7; color: var(--ink); padding: 0 0.5rem; }

.memory-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.memory-small { position: relative; background: var(--paper); padding: 0.5rem 0.5rem 0.875rem; border-radius: var(--radius-sm); box-shadow: var(--shadow-photo); transition: transform 0.3s var(--ease); }
.memory-small:hover { transform: translateY(-3px); }
.memory-small:nth-child(odd) { transform: rotate(-1deg); }
.memory-small:nth-child(even) { transform: rotate(0.8deg); }
.memory-small:nth-child(odd):hover { transform: translateY(-3px) rotate(-1deg); }
.memory-small:nth-child(even):hover { transform: translateY(-3px) rotate(0.8deg); }
.memory-small-photo { aspect-ratio: 1; border-radius: 4px; overflow: hidden; margin-bottom: 0.5rem; background: var(--cream-deep); }
.memory-small-photo img { width: 100%; height: 100%; object-fit: cover; }
.memory-small-caption { font-family: var(--font-en-script); font-size: 1.0625rem; text-align: center; color: var(--ink-soft); }

.places-list, .activities-list, .tips-list { max-width: 44rem; margin: 0 auto; padding: 0 1.25rem; display: flex; flex-direction: column; gap: 0.75rem; }
.places-item, .activities-item { display: flex; align-items: center; gap: 1rem; padding: 1rem 1.25rem; background: var(--paper); border-radius: var(--radius-md); border: 1px solid var(--line); font-family: var(--font-display); font-size: 1.25rem; color: var(--ink); transition: transform 0.2s ease, border-color 0.2s ease; }
.places-item:hover, .activities-item:hover { transform: translateX(-4px); border-color: var(--gold); }
.places-item-num { width: 2rem; height: 2rem; border-radius: 9999px; background: var(--terracotta); color: var(--cream-soft); display: flex; align-items: center; justify-content: center; font-family: var(--font-en-display); font-size: 0.875rem; font-weight: 700; flex-shrink: 0; }
.places-item-text { flex: 1; }

.tips-list { display: grid; grid-template-columns: 1fr; gap: 1rem; max-width: 52rem; }
@media (min-width: 640px) { .tips-list { grid-template-columns: repeat(2, 1fr); } }
.tip-item { position: relative; padding: 1.25rem 1.125rem; background: #F5E5A8; border-radius: 4px; box-shadow: var(--shadow-photo); font-family: var(--font-display); font-size: 1.125rem; line-height: 1.6; color: var(--ink); }
.tips-list .tip-item:nth-child(4n+1) { background: #F5E5A8; transform: rotate(-0.8deg); }
.tips-list .tip-item:nth-child(4n+2) { background: #F2D5D0; transform: rotate(0.6deg); }
.tips-list .tip-item:nth-child(4n+3) { background: #D4DDE5; transform: rotate(-0.4deg); }
.tips-list .tip-item:nth-child(4n+4) { background: #D5DDC8; transform: rotate(0.9deg); }
.tip-item::before { content: '✦'; display: inline-block; margin-inline-end: 0.5rem; color: var(--gold-deep); font-size: 0.875rem; }

.stays-list, .food-list { max-width: 56rem; margin: 0 auto; padding: 0 1.25rem; display: grid; grid-template-columns: 1fr; gap: 1rem; }
@media (min-width: 640px) { .stays-list, .food-list { grid-template-columns: repeat(2, 1fr); gap: 1.25rem; } }
.stay-card, .food-card { background: var(--paper); border-radius: var(--radius-md); padding: 1.25rem 1.375rem; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 0.375rem; transition: box-shadow 0.3s ease, transform 0.3s ease; }
.stay-card:hover, .food-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
.stay-card-name, .food-card-name { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; color: var(--ink); line-height: 1.2; }
.stay-card-type, .food-card-type { font-family: var(--font-en-script); font-size: 1.0625rem; color: var(--gold-deep); }
.stay-card-note, .food-card-note { font-size: 0.9375rem; color: var(--ink-soft); line-height: 1.6; margin-top: 0.25rem; }

.feelings-block { max-width: 44rem; margin: 0 auto; padding: 2rem 1.5rem; position: relative; text-align: center; }
.feelings-quote-mark { font-family: var(--font-en-display); font-size: 5rem; line-height: 1; color: var(--gold); opacity: 0.5; margin-bottom: -1rem; }
.feelings-text { font-family: var(--font-display); font-size: 1.5rem; line-height: 1.7; color: var(--ink); font-weight: 500; }
@media (min-width: 640px) { .feelings-text { font-size: 1.75rem; } }
.feelings-attribution { margin-top: 1.5rem; font-family: var(--font-en-script); font-size: 1.25rem; color: var(--ink-mute); }

.gallery-section { padding: 4rem 0 6rem; }
.gallery-layout { max-width: 72rem; margin: 0 auto; padding: 0 1.25rem; }
.gallery-featured { position: relative; border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 2rem; aspect-ratio: 16/9; box-shadow: var(--shadow-lg); }
.gallery-featured img { width: 100%; height: 100%; object-fit: cover; }
.gallery-featured-caption { position: absolute; bottom: 1.5rem; right: 1.5rem; left: 1.5rem; font-family: var(--font-en-script); font-size: 1.75rem; color: var(--cream-soft); text-shadow: 0 2px 8px rgba(0,0,0,0.5); text-align: center; }
.gallery-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
@media (min-width: 768px) { .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 1.5rem; } }
.gallery-item { position: relative; background: var(--paper); padding: 0.5rem 0.5rem 0.875rem; border-radius: var(--radius-sm); box-shadow: var(--shadow-photo); transition: transform 0.4s var(--ease); }
.gallery-item:nth-child(3n+1) { transform: rotate(-1deg); }
.gallery-item:nth-child(3n+2) { transform: rotate(0.8deg); }
.gallery-item:nth-child(3n+3) { transform: rotate(-0.5deg); }
.gallery-item:hover { transform: scale(1.04) rotate(0deg); z-index: 2; }
.gallery-item-photo { aspect-ratio: 1; border-radius: 4px; overflow: hidden; margin-bottom: 0.5rem; background: var(--cream-deep); }
.gallery-item-photo img { width: 100%; height: 100%; object-fit: cover; }
.gallery-item-caption { font-family: var(--font-en-script); font-size: 1.0625rem; text-align: center; color: var(--ink-soft); }

/* =========================================================
   10. FOOTER
   ========================================================= */
.footer { padding: 4rem 1.25rem 3rem; text-align: center; border-top: 1px solid var(--line); background: var(--cream-warm); margin-top: 2rem; }
.footer-mark { font-family: var(--font-en-script); font-size: 2.25rem; color: var(--ink); line-height: 1; margin-bottom: 0.5rem; }
.footer-mark-amp { color: var(--gold-deep); font-style: italic; }
.footer-tagline { font-family: var(--font-display); font-size: 1.125rem; color: var(--ink-soft); margin-bottom: 1rem; }
.footer-meta { font-size: 0.8125rem; color: var(--ink-mute); }
.footer-deco { margin-top: 1.25rem; color: var(--gold-deep); letter-spacing: 0.5em; font-size: 0.875rem; }

/* =========================================================
   11. BUTTONS, INPUTS, MODAL
   ========================================================= */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border-radius: 9999px; font-size: 0.9375rem; font-weight: 500; transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease; cursor: pointer; font-family: inherit; }
.btn-primary { background: var(--ink); color: var(--cream-soft); }
.btn-primary:hover { background: var(--terracotta); }
.btn-primary:active { transform: translateY(1px); }
.btn-ghost { color: var(--ink); }
.btn-ghost:hover { color: var(--terracotta); }
.btn-sm { padding: 0.5rem 1.125rem; font-size: 0.8125rem; }
.btn-danger { background: var(--rust); color: var(--cream-soft); }
.btn-danger:hover { background: var(--terracotta); }
.btn-cancel { padding: 0.75rem 1.25rem; border-radius: 9999px; font-size: 0.875rem; background: var(--cream-warm); color: var(--ink); cursor: pointer; transition: background 0.2s ease; font-family: inherit; }
.btn-cancel:hover { background: var(--cream-deep); }
.btn-flex { flex: 1; }

.input-field { background: var(--cream-soft); border: 1px solid var(--line-strong); color: var(--ink); padding: 10px 14px; border-radius: var(--radius-sm); width: 100%; transition: border-color 0.2s ease, box-shadow 0.2s ease; font-size: 0.9375rem; line-height: 1.5; resize: vertical; font-family: inherit; }
.input-field:focus { outline: none; border-color: var(--gold-deep); box-shadow: 0 0 0 3px rgba(201,169,97,0.15); }
.field-label { font-size: 0.8125rem; display: block; margin-bottom: 0.375rem; color: var(--ink-soft); font-weight: 500; }
.field-group { display: flex; flex-direction: column; }
.field-hint { font-size: 0.75rem; color: var(--ink-mute); margin-top: 0.25rem; }

.modal-overlay { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(42,31,21,0.55); backdrop-filter: blur(4px); animation: fadeIn 0.25s ease both; }
.modal { position: relative; width: 100%; max-width: 32rem; border-radius: var(--radius-lg); padding: 1.75rem; max-height: 90vh; overflow-y: auto; background: var(--cream-soft); animation: modalIn 0.3s var(--ease) both; box-shadow: var(--shadow-lg); }
.modal-close { position: absolute; top: 1rem; left: 1rem; color: var(--ink-mute); transition: color 0.2s ease; }
.modal-close:hover { color: var(--terracotta); }
.modal-title { font-family: var(--font-display); font-size: 1.75rem; font-weight: 600; margin-bottom: 1.25rem; color: var(--ink); }
.modal-form { display: flex; flex-direction: column; gap: 1rem; }
.modal-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
@media (max-width: 480px) { .modal-form-row { grid-template-columns: 1fr; } }
.modal-form-actions { display: flex; gap: 0.75rem; padding-top: 0.75rem; flex-wrap: wrap; }

.color-picker { display: flex; gap: 0.5rem; margin-top: 0.375rem; flex-wrap: wrap; }
.color-swatch { width: 2rem; height: 2rem; border-radius: 9999px; cursor: pointer; border: 2px solid transparent; transition: transform 0.2s ease, border-color 0.2s ease; }
.color-swatch:hover { transform: scale(1.1); }
.color-swatch.active { border-color: var(--ink); }

/* =========================================================
   12. SETTINGS PANEL (slide-in from leading edge)
   ========================================================= */
.settings-overlay { position: fixed; inset: 0; z-index: 65; background: rgba(42,31,21,0.45); backdrop-filter: blur(3px); animation: fadeIn 0.2s ease both; }
.settings-panel {
  position: fixed;
  top: 0; bottom: 0;
  /* In RTL the leading edge is right; we slide from left visually */
  left: 0;
  width: 100%; max-width: 32rem;
  background: var(--cream-soft);
  z-index: 66;
  display: flex; flex-direction: column;
  box-shadow: var(--shadow-lg);
  animation: slideInLeft 0.3s var(--ease) both;
}
@keyframes slideInLeft { from { transform: translateX(-100%); } to { transform: translateX(0); } }
.settings-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 1rem; background: var(--cream-warm); }
.settings-title { font-family: var(--font-display); font-size: 1.625rem; font-weight: 600; color: var(--ink); }
.settings-tabs { display: flex; gap: 0.25rem; padding: 0.625rem 1rem; overflow-x: auto; background: var(--cream-warm); border-bottom: 1px solid var(--line); }
.settings-tab { padding: 0.5rem 0.875rem; border-radius: 9999px; font-size: 0.875rem; white-space: nowrap; color: var(--ink-soft); transition: background 0.2s ease, color 0.2s ease; }
.settings-tab:hover { background: var(--cream-deep); }
.settings-tab.active { background: var(--ink); color: var(--cream-soft); }
.settings-body { flex: 1; overflow-y: auto; padding: 1.5rem; }
.settings-footer { padding: 1rem 1.5rem; border-top: 1px solid var(--line); display: flex; gap: 0.625rem; background: var(--cream-warm); }

.settings-group { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1.5rem; }
.settings-group-title { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; color: var(--ink); padding-bottom: 0.5rem; border-bottom: 1px solid var(--line); margin-bottom: 0.5rem; }

/* Color row */
.color-row { display: flex; align-items: center; gap: 0.75rem; padding: 0.5rem 0; }
.color-row-label { flex: 1; font-size: 0.9375rem; color: var(--ink); }
.color-row-hex { font-family: monospace; font-size: 0.8125rem; color: var(--ink-mute); }
.color-input { width: 2.5rem; height: 2.5rem; border-radius: 9999px; border: 2px solid var(--line-strong); cursor: pointer; background: none; padding: 0; overflow: hidden; }
.color-input::-webkit-color-swatch-wrapper { padding: 0; }
.color-input::-webkit-color-swatch { border: none; border-radius: 9999px; }
.color-input::-moz-color-swatch { border: none; border-radius: 9999px; }

/* Font select */
.font-select { width: 100%; padding: 10px 14px; background: var(--paper); border: 1px solid var(--line-strong); border-radius: var(--radius-sm); font-size: 0.9375rem; color: var(--ink); }

/* =========================================================
   13. TRIP EDITOR (full-screen overlay)
   ========================================================= */
.trip-editor { position: fixed; inset: 0; z-index: 70; background: var(--cream); display: flex; flex-direction: column; animation: fadeIn 0.2s ease both; }
.trip-editor-header { padding: 1rem 1.25rem; border-bottom: 1px solid var(--line); background: var(--cream-soft); display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
.trip-editor-title { font-family: var(--font-display); font-size: 1.5rem; font-weight: 600; color: var(--ink); }
.trip-editor-tabs { display: flex; gap: 0.25rem; padding: 0.625rem 1rem; overflow-x: auto; background: var(--cream-warm); border-bottom: 1px solid var(--line); }
.trip-editor-tab { padding: 0.5rem 0.875rem; border-radius: 9999px; font-size: 0.875rem; white-space: nowrap; color: var(--ink-soft); transition: background 0.2s ease, color 0.2s ease; display: inline-flex; align-items: center; gap: 0.375rem; }
.trip-editor-tab:hover { background: var(--cream-deep); }
.trip-editor-tab.active { background: var(--ink); color: var(--cream-soft); }
.trip-editor-content { flex: 1; overflow-y: auto; padding: 1.5rem 1.25rem; }
.trip-editor-inner { max-width: 48rem; margin: 0 auto; }
@media (min-width: 640px) { .trip-editor-content { padding: 2rem; } }
.trip-editor-footer { padding: 1rem 1.25rem; border-top: 1px solid var(--line); background: var(--cream-soft); display: flex; gap: 0.625rem; justify-content: space-between; flex-wrap: wrap; }
.trip-editor-footer-left, .trip-editor-footer-right { display: flex; gap: 0.625rem; }

/* List editor items (memories, stays, food, etc) */
.list-editor { display: flex; flex-direction: column; gap: 0.875rem; }
.list-item-card { background: var(--paper); border-radius: var(--radius-md); padding: 1rem; border: 1px solid var(--line); display: flex; flex-direction: column; gap: 0.75rem; }
.list-item-header { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.list-item-num { font-family: var(--font-en-display); font-size: 0.875rem; color: var(--gold-deep); font-weight: 700; }
.list-item-controls { display: flex; gap: 0.25rem; }
.list-item-btn { width: 2rem; height: 2rem; border-radius: 9999px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-mute); transition: background 0.2s ease, color 0.2s ease; }
.list-item-btn:hover { background: var(--cream-warm); color: var(--ink); }
.list-item-btn.danger:hover { background: var(--rust); color: var(--cream-soft); }

.list-add-btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem 1rem; border: 2px dashed var(--line-strong); border-radius: var(--radius-md); color: var(--ink-mute); font-size: 0.9375rem; cursor: pointer; transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease; width: 100%; }
.list-add-btn:hover { border-color: var(--gold-deep); color: var(--ink); background: rgba(201,169,97,0.05); }

/* Image preview in editor */
.image-edit-row { display: flex; gap: 0.75rem; align-items: stretch; }
.image-preview { width: 4.5rem; height: 4.5rem; border-radius: var(--radius-sm); overflow: hidden; background: var(--cream-deep); flex-shrink: 0; }
.image-preview img { width: 100%; height: 100%; object-fit: cover; }
.image-edit-fields { flex: 1; display: flex; flex-direction: column; gap: 0.5rem; }

/* =========================================================
   14. ANIMATIONS
   ========================================================= */
.fade-in { animation: fadeIn 0.5s ease both; }
.stagger-1 { animation-delay: 0.05s; }
.stagger-2 { animation-delay: 0.1s; }
.stagger-3 { animation-delay: 0.15s; }
.stagger-4 { animation-delay: 0.2s; }
.stagger-5 { animation-delay: 0.25s; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: none; } }
.spinner { width: 1.75rem; height: 1.75rem; color: var(--gold-deep); animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.empty-state { text-align: center; padding: 3rem 1.5rem; color: var(--ink-mute); font-family: var(--font-display); font-size: 1.25rem; }

/* =========================================================
   15. RESPONSIVE TWEAKS
   ========================================================= */
@media (max-width: 480px) {
  .hero { padding: 2.5rem 1rem 4rem; }
  .hero-title-line { font-size: clamp(3.5rem, 22vw, 6rem); }
  .nav-add-btn span { display: none; }
  .detail-hero-back span { display: none; }
  .login-card { padding: 2rem 1.25rem; }
  .login-title { font-size: 2rem; }
  .settings-panel { max-width: 100%; }
}

/* =========================================================
   UTILITIES
   ========================================================= */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function newId(prefix) { return (prefix || 'x') + '_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7); }
function deepCopy(obj) { return JSON.parse(JSON.stringify(obj)); }

/* =========================================================
   STORAGE
   ========================================================= */
function loadFromStorage(key, fallback) {
  try {
    const stored = localStorage.getItem(key);
    if (stored) return JSON.parse(stored);
  } catch (e) { /* ignore */ }
  try { localStorage.setItem(key, JSON.stringify(fallback)); } catch (e) {}
  return deepCopy(fallback);
}
function saveToStorage(key, data) {
  try { localStorage.setItem(key, JSON.stringify(data)); }
  catch (e) { console.warn('Storage write failed:', e); }
}

/* =========================================================
   PASSWORD HASHING (SHA-256 via SubtleCrypto)
   ========================================================= */
async function sha256(text) {
  const buf = new TextEncoder().encode(text);
  const digest = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
}

/* =========================================================
   APPLY SETTINGS — write CSS variables and update DOM
   ========================================================= */
function applySettings() {
  if (!state.settings) return;
  const s = state.settings;
  const root = document.documentElement;

  // Colors
  if (s.colors) {
    Object.keys(s.colors).forEach(function(k){
      root.style.setProperty('--' + k, s.colors[k]);
    });
  }
  // Fonts
  if (s.fonts) {
    if (s.fonts.body)      root.style.setProperty('--font-body', s.fonts.body);
    if (s.fonts.display)   root.style.setProperty('--font-display', s.fonts.display);
    if (s.fonts.enDisplay) root.style.setProperty('--font-en-display', s.fonts.enDisplay);
    if (s.fonts.enScript)  root.style.setProperty('--font-en-script', s.fonts.enScript);
    if (s.fonts.hero)      root.style.setProperty('--font-hero', s.fonts.hero);
  }
}

  '<section class="toc-section container">' +
    '<div class="toc-card">' +
      '<h3 class="toc-title">TRAVEL JOURNAL</h3>' +
      '<div class="toc-title-ar">دفتر الرحلة</div>' +

        SECTIONS.map(function(sec){
          const count = counts[sec.key];

          return '<button class="toc-item" data-action="scroll-to" data-target="section-' + sec.key + '">' +
            '<span class="toc-item-icon">' + sec.icon + '</span>' +

const COLOR_LABELS = {
  cream: 'الكريم الأساسي',
  'cream-warm': 'كريم دافئ',
  'cream-soft': 'كريم ناعم',
  'cream-deep': 'كريم غامق',
  paper: 'الورق',
  ink: 'الحبر (نص أساسي)',
  'ink-soft': 'حبر ناعم',
  'ink-mute': 'حبر باهت',
  gold: 'الذهبي',
  'gold-deep': 'ذهبي غامق',
  terracotta: 'التيراكوتا',
  rust: 'صدأ',
};

function renderSettingsColors() {
  const colors = state.settings.colors || {};
  return '' +
  '<div class="settings-group">' +
    '<div class="settings-group-title">ألوان الموقع</div>' +
    '<div class="field-hint" style="margin-bottom:0.75rem;">اضغط على دائرة اللون لاختيار لون جديد. التغييرات تُحفظ تلقائياً.</div>' +
    Object.keys(colors).map(function(key){
      const val = colors[key];
      const label = COLOR_LABELS[key] || key;
      return '<div class="color-row">' +
        '<input type="color" class="color-input" data-settings-color="' + key + '" value="' + esc(val) + '">' +
        '<div class="color-row-label">' + esc(label) + '</div>' +
        '<div class="color-row-hex">' + esc(val.toUpperCase()) + '</div>' +
      '</div>';
    }).join('') +
  '</div>';
}

function renderSettingsFonts() {
  const fonts = state.settings.fonts || {};
  const fontField = (label, key, options) => {
    return '<div class="field-group">' +
      '<label class="field-label">' + esc(label) + '</label>' +
      '<select class="font-select" data-settings-font="' + key + '">' +
        options.map(function(o){
          return '<option value="' + esc(o.value) + '" ' + (fonts[key] === o.value ? 'selected' : '') + '>' + esc(o.label) + '</option>';
        }).join('') +
      '</select>' +
    '</div>';
  };

  return '' +

  for (let i = 0; i < parts.length; i++) { val = val ? val[parts[i]] : ''; }
  val = val || '';
  const inner = isTextarea
    ? '<textarea class="input-field" data-trip-field="' + fieldPath + '" rows="' + (rows || 3) + '">' + esc(val) + '</textarea>'
    : '<input class="input-field" data-trip-field="' + fieldPath + '" value="' + esc(val) + '">';
  return '<div class="field-group">' +
    '<label class="field-label">' + esc(label) + '</label>' +
    inner +

   MAIN RENDER ORCHESTRATION
   ========================================================= */
function renderApp() {
  // If not authenticated, show only login screen
  if (!state.authed) return renderLoginScreen();

  let main = '';
  if (state.view === 'home') {
    main = renderHero() + renderDestinationsSection() + renderNotesSection();
  } else if (state.view === 'detail') {
    const trip = state.trips.find(function(t){ return t.id === state.currentTripId; });
    if (trip) main = renderTripDetail(trip);
    else main = '<div class="empty-state">الرحلة غير موجودة</div>';
  }
  return renderTopNav() + '<main>' + main + '</main>' + renderFooter() +
    (state.showAddNote ? renderAddNoteModal() : '') +
    (state.showSettings ? renderSettingsPanel() : '') +
    (state.editingTripDraft ? renderTripEditor() : '');
}

function render() {
  // Preserve focused element across re-renders so typing in inputs doesn't lose focus
  const active = document.activeElement;
  let focusKey = null, selStart = null, selEnd = null;
  if (active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.tagName === 'SELECT')) {
    focusKey = active.dataset.form && active.dataset.field
      ? 'form:' + active.dataset.form + ':' + active.dataset.field
      : active.dataset.settingsField
      ? 'settings:' + active.dataset.settingsField
      : active.dataset.settingsColor
      ? 'color:' + active.dataset.settingsColor
      : active.dataset.settingsFont
      ? 'font:' + active.dataset.settingsFont
      : active.dataset.tripField
      ? 'trip:' + active.dataset.tripField
      : active.id
      ? 'id:' + active.id
      : null;
    try {
      selStart = active.selectionStart;
      selEnd = active.selectionEnd;
    } catch (e) { /* some inputs don't support */ }
  }

  document.getElementById('app').innerHTML = renderApp();

  // Apply edit-mode class to body
  document.body.classList.toggle('edit-mode', state.editMode);
  document.body.style.overflow = (state.showAddNote || state.showSettings || state.editingTripDraft) ? 'hidden' : '';

  // Restore focus
  if (focusKey) {
    let restored = null;
    if (focusKey.startsWith('form:')) {
      const [_, form, field] = focusKey.split(':');
      restored = document.querySelector('[data-form="' + form + '"][data-field="' + field + '"]');
    } else if (focusKey.startsWith('settings:')) {
      restored = document.querySelector('[data-settings-field="' + focusKey.slice(9) + '"]');
    } else if (focusKey.startsWith('color:')) {
      restored = document.querySelector('[data-settings-color="' + focusKey.slice(6) + '"]');
    } else if (focusKey.startsWith('font:')) {
      restored = document.querySelector('[data-settings-font="' + focusKey.slice(5) + '"]');
    } else if (focusKey.startsWith('trip:')) {
      restored = document.querySelector('[data-trip-field="' + focusKey.slice(5) + '"]');
    } else if (focusKey.startsWith('id:')) {
      restored = document.getElementById(focusKey.slice(3));
    }
    if (restored) {
      restored.focus();
      try { if (selStart != null) restored.setSelectionRange(selStart, selEnd); } catch (e) {}
    }
  }
}

// --- AUTH ---
async function submitLogin(e) {
  if (e && e.preventDefault) e.preventDefault();
  const f = state.loginForm;
  if (!f.password) {
    state.loginForm.error = 'من فضلك أدخل كلمة السر';
    render(); return;
  }
  state.loginForm.loading = true;
  state.loginForm.error = '';
  render();
  try {
    const hash = await sha256(f.password);
    if (hash === PASSWORD_HASH) {
      state.authed = true;
      state.loginForm = initialLoginForm();
      try { sessionStorage.setItem(SESSION_KEY_AUTH, '1'); } catch (e) {}
      render();
    } else {
      state.loginForm.loading = false;
      state.loginForm.error = 'كلمة السر غير صحيحة';
      state.loginForm.password = '';
      render();
    }
  } catch (e) {
    state.loginForm.loading = false;
    state.loginForm.error = 'حدث خطأ، حاول مرة أخرى';
    render();
  }
}
function togglePassword() {
  state.loginForm.showPassword = !state.loginForm.showPassword;
  render();
  // Restore focus to the password input
  setTimeout(function(){
    const el = document.getElementById('login-password');
    if (el) {
      el.focus();
      try { el.setSelectionRange(el.value.length, el.value.length); } catch(e){}
    }
  }, 0);
}
function logout() {
  if (!confirm('تسجيل الخروج؟')) return;
  state.authed = false;
  state.view = 'home';
  state.editMode = false;
  state.loginForm = initialLoginForm();
  try { sessionStorage.removeItem(SESSION_KEY_AUTH); } catch (e) {}
  render();
}

function goHome() { state.view = 'home'; state.currentTripId = null; render(); window.scrollTo({ top: 0, behavior: 'auto' }); }

  setTimeout(function(){

}

}
function saveNote() {
  const f = state.addNoteForm;
  if (!f.text.trim()) { alert('من فضلك اكتب نص الملاحظة'); return; }
  if (f.id) {
    state.notes = state.notes.map(function(n){
      return n.id === f.id ? Object.assign({}, n, { text: f.text.trim(), color: f.color }) : n;
    });
  } else {
    const note = { id: newId('n'), text: f.text.trim(), color: f.color || 'yellow', createdAt: Date.now() };
    state.notes = [note].concat(state.notes);
  }
  state.showAddNote = false;
  saveToStorage(STORAGE_KEY_NOTES, state.notes);
  render();
}
function deleteNote(id) {
  if (!confirm('حذف هذه الملاحظة؟')) return;
  state.notes = state.notes.filter(function(n){ return n.id !== id; });
  saveToStorage(STORAGE_KEY_NOTES, state.notes);
  render();
}
function selectNoteColor(color) { state.addNoteForm.color = color; render(); }

// --- SETTINGS ---
function openSettings() { state.showSettings = true; state.settingsTab = 'text'; render(); }
function setSettingsTab(tab) { state.settingsTab = tab; render(); }
function updateSettingsField(field, value) {
  state.settings[field] = value;
  saveToStorage(STORAGE_KEY_SETTINGS, state.settings);
}
function updateSettingsColor(key, value) {
  if (!state.settings.colors) state.settings.colors = {};
  state.settings.colors[key] = value;
  saveToStorage(STORAGE_KEY_SETTINGS, state.settings);
  applySettings();
  // Re-render so hex label updates, but try to keep the color picker focused
  render();
}
function updateSettingsFont(key, value) {
  if (!state.settings.fonts) state.settings.fonts = {};
  state.settings.fonts[key] = value;
  saveToStorage(STORAGE_KEY_SETTINGS, state.settings);
  applySettings();
  render();
}
function resetSettings() {
  if (!confirm('استعادة جميع الإعدادات الافتراضية (النصوص والألوان والخطوط)؟')) return;
  state.settings = deepCopy(DEFAULT_SETTINGS);
  saveToStorage(STORAGE_KEY_SETTINGS, state.settings);
  applySettings();
  render();
}

// --- DATA EXPORT/IMPORT ---
function exportData() {
  const data = {
    version: 3,
    exportedAt: new Date().toISOString(),
    trips: state.trips,
    notes: state.notes,
    settings: state.settings,
  };
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'travel-blog-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 100);
}
function importData() {
  document.getElementById('import-file-input').click();
}
function handleImportFile(e) {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev){
    try {
      const data = JSON.parse(ev.target.result);
      if (!data || !data.trips || !data.notes) {
        alert('ملف غير صحيح');
        return;
      }
      if (!confirm('استبدال البيانات الحالية بمحتوى الملف؟ هذا الإجراء لا يمكن التراجع عنه.')) return;
      state.trips = data.trips || [];
      state.notes = data.notes || [];
      if (data.settings) state.settings = Object.assign({}, DEFAULT_SETTINGS, data.settings);
      saveToStorage(STORAGE_KEY_TRIPS, state.trips);
      saveToStorage(STORAGE_KEY_NOTES, state.notes);
      saveToStorage(STORAGE_KEY_SETTINGS, state.settings);
      applySettings();
      render();
      alert('تم الاستيراد بنجاح');
    } catch (err) {
      alert('خطأ في قراءة الملف: ' + err.message);
    }
  };
  reader.readAsText(file);
  // Reset so the same file can be selected again later
  e.target.value = '';
}
function resetAllData() {
  if (!confirm('تحذير: سيتم حذف كل الرحلات والملاحظات والإعدادات نهائياً. متأكد؟')) return;
  if (!confirm('تأكيد أخير — لا يمكن التراجع عن هذا.')) return;
  try {
    localStorage.removeItem(STORAGE_KEY_TRIPS);
    localStorage.removeItem(STORAGE_KEY_NOTES);
    localStorage.removeItem(STORAGE_KEY_SETTINGS);
  } catch (e) {}
  state.trips = deepCopy(SAMPLE_TRIPS);
  state.notes = deepCopy(SAMPLE_NOTES);
  state.settings = deepCopy(DEFAULT_SETTINGS);
  saveToStorage(STORAGE_KEY_TRIPS, state.trips);
  saveToStorage(STORAGE_KEY_NOTES, state.notes);
  saveToStorage(STORAGE_KEY_SETTINGS, state.settings);
  applySettings();
  state.showSettings = false;
  render();
}

// --- TRIP EDITOR ---
function emptyTripDraft() {
  return {
    id: newId('trip'),
    titleAr: '', titleEn: '', location: '',
    dateStart: '', dateEnd: '', dateRange: '',
    emoji: '✈️',
    coverImage: '', thumbImage: '',
    intro: '',
    summary: { duration: '', cities: '', weather: '', bestFor: '' },
    memories: [], places: [], stays: [], food: [], activities: [],
    feelings: '', tips: [],
  };
}
function addTrip() {
  state.editingTripDraft = emptyTripDraft();
  state.tripEditorTab = 'basics';
  render();
}
function editTrip(id) {
  const trip = state.trips.find(function(t){ return t.id === id; });
  if (!trip) return;
  state.editingTripDraft = deepCopy(trip);
  state.tripEditorTab = 'basics';
  render();
}
function closeTripEditor() {
  if (confirm('إغلاق المحرر؟ التغييرات غير المحفوظة ستُفقد.')) {
    state.editingTripDraft = null;
    render();
  }
}
function setTripEditorTab(tab) {
  state.tripEditorTab = tab;
  render();
}
function saveTrip() {
  const t = state.editingTripDraft;
  if (!t) return;
  if (!t.titleAr || !t.titleAr.trim()) {
    alert('من فضلك أدخل عنوان الرحلة بالعربي');
    state.tripEditorTab = 'basics';
    render();
    return;
  }
  const exists = state.trips.find(function(x){ return x.id === t.id; });
  if (exists) {
    state.trips = state.trips.map(function(x){ return x.id === t.id ? t : x; });
  } else {
    state.trips = state.trips.concat([t]);
  }
  saveToStorage(STORAGE_KEY_TRIPS, state.trips);
  state.editingTripDraft = null;
  render();
}
function deleteTripFromEditor() {
  const t = state.editingTripDraft;
  if (!t) return;
  if (!confirm('حذف هذه الوجهة نهائياً؟')) return;
  state.trips = state.trips.filter(function(x){ return x.id !== t.id; });
  saveToStorage(STORAGE_KEY_TRIPS, state.trips);
  state.editingTripDraft = null;
  if (state.currentTripId === t.id) { state.view = 'home'; state.currentTripId = null; }
  render();
}
function deleteTrip(id) {
  if (!confirm('حذف هذه الوجهة نهائياً؟')) return;
  state.trips = state.trips.filter(function(t){ return t.id !== id; });
  saveToStorage(STORAGE_KEY_TRIPS, state.trips);
  if (state.currentTripId === id) { state.view = 'home'; state.currentTripId = null; }
  render();
}

// Update a nested field in editingTripDraft by dot path
function updateTripField(path, value) {
  const parts = path.split('.');
  let obj = state.editingTripDraft;
  for (let i = 0; i < parts.length - 1; i++) {
    const key = parts[i];
    if (obj[key] == null) {
      // Decide whether to create array or object based on next key
      const nextKey = parts[i+1];
      obj[key] = (/^\d+$/.test(nextKey)) ? [] : {};
    }
    obj = obj[key];
  }
  const lastKey = parts[parts.length - 1];
  obj[lastKey] = value;
  // Don't save to storage yet (only on Save button); but we DO want UI updates.
  // We avoid a full render here because typing in the trip-editor inputs would lose focus.
  // The image previews will update only when the user changes tabs / re-renders for other reasons.
}

function addListItem(listName) {
  const t = state.editingTripDraft;
  if (!t) return;
  if (!t[listName]) t[listName] = [];
  if (listName === 'memories') t[listName].push({ image: '', caption: '', story: '' });
  else if (listName === 'stays' || listName === 'food') t[listName].push({ name: '', type: '', note: '' });
  else t[listName].push('');
  render();
}
function deleteListItem(listName, index) {
  const t = state.editingTripDraft;
  if (!t || !t[listName]) return;
  if (!confirm('حذف هذا العنصر؟')) return;
  t[listName].splice(index, 1);
  render();
}
function moveListItem(listName, index, dir) {
  const t = state.editingTripDraft;
  if (!t || !t[listName]) return;
  const newIdx = index + dir;
  if (newIdx < 0 || newIdx >= t[listName].length) return;
  const tmp = t[listName][index];
  t[listName][index] = t[listName][newIdx];
  t[listName][newIdx] = tmp;
  render();
}


/* =========================================================
   EVENT DELEGATION
   ========================================================= */
function handleClick(e) {
  // Overlay click closes modals (only on the overlay itself, not its children)
  if (e.target.dataset && e.target.dataset.modal === 'overlay') {
    closeModal(); return;
  }
  // If clicking inside a destination card's edit overlay, stop the card from opening
  const noOpen = e.target.closest('[data-no-open]');
  if (noOpen) e.stopPropagation();

  const target = e.target.closest('[data-action]');
  if (!target) return;
  // If the target is inside [data-no-open], we still want the action to fire
  // but we want to prevent the outer "open-trip" action from firing too.
  if (target.dataset.action !== 'open-trip' && noOpen) {
    e.stopPropagation();
  }

  const action = target.dataset.action;
  const id = target.dataset.id;
  const value = target.dataset.value;
  const tgt = target.dataset.target;

  switch (action) {
    // auth
    case 'submit-login': submitLogin(e); break;
    case 'toggle-password': togglePassword(); break;
    case 'logout': logout(); break;

    // navigation
    case 'go-home': goHome(); break;
    case 'open-trip': openTrip(id); break;
    case 'scroll-to': scrollToTarget(tgt); break;

    // edit mode
    case 'toggle-edit-mode': toggleEditMode(); break;

    // notes
    case 'show-add-note': showAddNote(); break;
    case 'edit-note': editNote(id); break;
    case 'save-note': saveNote(); break;
    case 'delete-note': deleteNote(id); break;
    case 'select-note-color': selectNoteColor(value); break;
    case 'close-modal': closeModal(); break;

    // settings
    case 'open-settings': openSettings(); break;
    case 'set-settings-tab': setSettingsTab(value); break;
    case 'reset-settings': resetSettings(); break;
    case 'export-data': exportData(); break;
    case 'import-data': importData(); break;
    case 'reset-all-data': resetAllData(); break;

    // trip editor
    case 'add-trip': addTrip(); break;
    case 'edit-trip': editTrip(id); break;
    case 'close-trip-editor': closeTripEditor(); break;
    case 'set-trip-editor-tab': setTripEditorTab(value); break;
    case 'save-trip': saveTrip(); break;
    case 'delete-trip': deleteTrip(id); break;
    case 'delete-trip-from-editor': deleteTripFromEditor(); break;
    case 'add-item': addListItem(target.dataset.list); break;
    case 'delete-item': deleteListItem(target.dataset.list, parseInt(target.dataset.index)); break;
    case 'move-item': moveListItem(target.dataset.list, parseInt(target.dataset.index), parseInt(target.dataset.dir)); break;
  }
}

function handleSubmit(e) {
  if (e.target.id === 'login-form') {
    submitLogin(e);
  }
}

function handleInput(e) {
  const t = e.target;

  // Plain form fields (login form, note form, etc) — silent update
  if (t.dataset.form && t.dataset.field && state[t.dataset.form]) {
    state[t.dataset.form][t.dataset.field] = t.value;
    return;
  }

  // Settings text fields — save to storage but don't re-render
  if (t.dataset.settingsField) {
    updateSettingsField(t.dataset.settingsField, t.value);
    return;
  }

  // Trip editor fields — silent update
  if (t.dataset.tripField) {
    updateTripField(t.dataset.tripField, t.value);
    return;
  }
}

function handleChange(e) {
  const t = e.target;

  // Color picker — re-render to reflect new color
  if (t.dataset.settingsColor) {
    updateSettingsColor(t.dataset.settingsColor, t.value);
    return;
  }
  // Font select — re-render
  if (t.dataset.settingsFont) {
    updateSettingsFont(t.dataset.settingsFont, t.value);
    return;
  }
  // File input for import
  if (t.id === 'import-file-input') {
    handleImportFile(e);
    return;
  }
}

function handleKeydown(e) {
  if (e.key === 'Escape') {
    if (state.editingTripDraft) {
      closeTripEditor();
      return;
    }
    if (state.showAddNote || state.showSettings) {
      closeModal();
    }
  }
}

/* =========================================================
   INIT
   ========================================================= */
function init() {
  // Load persisted state
  state.trips    = loadFromStorage(STORAGE_KEY_TRIPS, SAMPLE_TRIPS);
  state.notes    = loadFromStorage(STORAGE_KEY_NOTES, SAMPLE_NOTES);
  // Merge stored settings on top of defaults so new fields appear in old saves
  const storedSettings = loadFromStorage(STORAGE_KEY_SETTINGS, DEFAULT_SETTINGS);
  state.settings = Object.assign({}, deepCopy(DEFAULT_SETTINGS), storedSettings);
  // Deep-merge nested colors and fonts
  state.settings.colors = Object.assign({}, DEFAULT_SETTINGS.colors, storedSettings.colors || {});
  state.settings.fonts  = Object.assign({}, DEFAULT_SETTINGS.fonts,  storedSettings.fonts  || {});

  // Check session auth — staying logged in until tab close
  try {
    if (sessionStorage.getItem(SESSION_KEY_AUTH) === '1') state.authed = true;
  } catch (e) {}

  applySettings();

  // Wire up listeners on document root so they survive re-renders of #app
  document.addEventListener('click', handleClick);
  document.addEventListener('submit', handleSubmit);
  document.addEventListener('input', handleInput);
  document.addEventListener('change', handleChange);
  document.addEventListener('keydown', handleKeydown);

  render();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
