<style>
/* =========================================================
   BASE & VARIABLES
   ========================================================= */
:root {
  --cream: #F5EFE5;
  --cream-2: #EFE8DA;
  --cream-3: #FAF5EC;
  --ink: #1F1A14;
  --ink-soft: #4A413A;
  --ink-mute: #847B70;
  --terracotta: #B85C43;
  --terracotta-dark: #8E3F2C;
  --gold: #E8C547;
  --tan: #D4C8B5;
  --tan-2: #E2D8C5;
  --line: rgba(31,26,20,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--cream); }
body { font-family: 'Tajawal', system-ui, sans-serif; color: var(--ink); min-height: 100vh; -webkit-font-smoothing: antialiased; }
button { background: none; border: none; cursor: pointer; font-family: inherit; color: inherit; font-size: inherit; padding: 0; text-align: inherit; }
input, textarea { font-family: inherit; }
a { color: inherit; text-decoration: none; cursor: pointer; }
img, svg { display: block; max-width: 100%; }

.display { font-family: 'Markazi Text', 'Amiri', serif; line-height: 1.15; letter-spacing: -0.005em; }

/* =========================================================
   LAYOUT
   ========================================================= */
.container { max-width: 72rem; margin: 0 auto; padding: 0 1.25rem; }
@media (min-width: 640px) { .container { padding: 0 2rem; } }

/* =========================================================
   TOP NAV
   ========================================================= */
.nav { position: sticky; top: 0; z-index: 30; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); background: rgba(245,239,229,0.85); border-bottom: 1px solid var(--line); }
.nav-inner { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: 1rem 0; }
.nav-logo { display: flex; align-items: center; gap: 0.5rem; }
.nav-logo .name { font-size: 1.5rem; font-weight: 600; color: var(--ink); }
@media (min-width: 640px) { .nav-logo .name { font-size: 1.875rem; } }
.nav-logo-orn { font-size: 0.875rem; color: var(--terracotta); letter-spacing: 0.4em; }
.nav-links { display: flex; align-items: center; gap: 1.25rem; font-size: 0.9375rem; color: var(--ink-soft); }
@media (min-width: 640px) { .nav-links { gap: 1.75rem; } }
.nav-link { position: relative; transition: color 0.2s ease; }
.nav-link::after { content: ''; position: absolute; right: 0; left: 0; bottom: -6px; height: 2px; background: var(--terracotta); transform: scaleX(0); transform-origin: right; transition: transform 0.3s ease; }
.nav-link:hover::after, .nav-link.active::after { transform: scaleX(1); }
.nav-link:hover, .nav-link.active { color: var(--ink); }
.hidden-sm { display: none; }
@media (min-width: 640px) { .hidden-sm { display: inline-block; } }
.hidden-md { display: none; }
@media (min-width: 768px) { .hidden-md { display: inline-block; } }

/* =========================================================
   BUTTONS
   ========================================================= */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem 1.5rem; border-radius: 9999px; font-size: 0.9375rem; font-weight: 500; transition: background 0.2s ease, transform 0.2s ease, color 0.2s ease; cursor: pointer; }
.btn-primary { background: var(--ink); color: var(--cream-3); }
.btn-primary:hover { background: var(--terracotta); }
.btn-primary:active { transform: translateY(1px); }
.btn-ghost { color: var(--ink); transition: color 0.2s ease; }
.btn-ghost:hover { color: var(--terracotta); }
.btn-sm { padding: 0.625rem 1.25rem; font-size: 0.875rem; }
.btn-flex { flex: 1; }
.btn-cancel { padding: 0.75rem 1.25rem; border-radius: 9999px; font-size: 0.875rem; background: var(--cream-2); color: var(--ink); cursor: pointer; border: none; font-family: inherit; transition: background 0.2s ease; }
.btn-cancel:hover { background: var(--tan-2); }

/* =========================================================
   INPUTS
   ========================================================= */
.input-field { background: var(--cream-3); border: 1px solid var(--line); color: var(--ink); padding: 10px 14px; border-radius: 6px; width: 100%; transition: border-color 0.2s ease, box-shadow 0.2s ease; font-size: 0.9375rem; line-height: 1.5; resize: vertical; }
.input-field:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 3px rgba(31,26,20,0.08); }
.field-label { font-size: 0.875rem; display: block; margin-bottom: 0.25rem; color: var(--ink-soft); }
.field-group { display: flex; flex-direction: column; gap: 0.25rem; }

/* =========================================================
   AVATAR & BYLINE
   ========================================================= */
.avatar { width: 2.25rem; height: 2.25rem; border-radius: 9999px; display: flex; align-items: center; justify-content: center; font-family: 'Markazi Text', serif; font-size: 0.875rem; font-weight: 600; flex-shrink: 0; border: 2px solid var(--cream); }
.avatar-stack { display: flex; }
.avatar-stack > *:not(:first-child) { margin-inline-start: -0.5rem; }
.byline { display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; }
.byline-text { font-size: 0.9375rem; color: var(--ink-soft); }
.highlight-name { background-image: linear-gradient(180deg, transparent 55%, var(--gold) 55%, var(--gold) 92%, transparent 92%); padding: 0 4px; font-family: 'Markazi Text', serif; font-size: 1.125rem; font-weight: 600; color: var(--ink); }
.byline-sep { margin: 0 0.5rem; color: var(--ink-mute); }
.byline-date { color: var(--ink-mute); }

/* =========================================================
   ORNAMENTS & SECTION LABELS
   ========================================================= */
.ornament { color: var(--terracotta); letter-spacing: 0.4em; }
.section-label { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.5rem; font-size: 0.875rem; color: var(--terracotta); }
.section-label-text { letter-spacing: 0.3em; }
.section-label-line { flex: 1; height: 1px; background: var(--line); }

/* =========================================================
   COVERS (gradient + SVG motif)
   ========================================================= */
.cover { position: relative; overflow: hidden; }
.cover .grain { position: absolute; inset: 0; background-image: radial-gradient(circle at 20% 25%, rgba(255,255,255,0.35) 0%, transparent 50%), radial-gradient(circle at 80% 75%, rgba(0,0,0,0.22) 0%, transparent 55%); pointer-events: none; }
.cover svg { position: absolute; }
.cover-featured { aspect-ratio: 16/10; border-radius: 1rem; }
@media (min-width: 640px) { .cover-featured { aspect-ratio: 16/8; } }
.cover-card { aspect-ratio: 4/3; border-radius: 0.75rem; }
.cover-detail { aspect-ratio: 16/9; }
@media (min-width: 640px) { .cover-detail { aspect-ratio: 16/7; } }
.cover-moment { aspect-ratio: 16/9; border-radius: 0.75rem; margin-bottom: 1.25rem; }
.cover-preview { aspect-ratio: 16/7; border-radius: 0.5rem; }

/* =========================================================
   FEATURED HERO
   ========================================================= */
.featured-section { padding: 2.5rem 0 4rem; }
.featured-cover-btn { width: 100%; display: block; padding: 0; border-radius: 1rem; overflow: hidden; }
.featured-meta { text-align: center; max-width: 48rem; margin: 2.5rem auto 0; }
.featured-location { margin-bottom: 1.25rem; font-size: 1rem; }
.featured-title { font-size: 3rem; font-weight: 600; line-height: 1.05; margin-bottom: 1.25rem; color: var(--ink); }
@media (min-width: 640px) { .featured-title { font-size: 3.75rem; } }
@media (min-width: 768px) { .featured-title { font-size: 4.5rem; } }
@media (max-width: 640px) { .featured-title { font-size: 2.5rem; } }
.featured-title-inner { display: inline-flex; align-items: center; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
.featured-emoji { font-size: 1.875rem; }
@media (min-width: 640px) { .featured-emoji { font-size: 2.25rem; } }
.featured-subtitle { font-size: 1.125rem; line-height: 1.6; margin-bottom: 1.75rem; color: var(--ink-soft); }
@media (min-width: 640px) { .featured-subtitle { font-size: 1.25rem; } }
.featured-byline-wrap { display: flex; justify-content: center; margin-bottom: 1.75rem; }
.featured-cta { display: flex; justify-content: center; }

/* =========================================================
   CARDS & GRID
   ========================================================= */
.card-hover { transition: transform 0.35s cubic-bezier(.2,.7,.2,1), box-shadow 0.35s ease; }
.card-hover:hover { transform: translateY(-4px); box-shadow: 0 18px 40px -20px rgba(31,26,20,0.25); }
.trips-grid { display: grid; grid-template-columns: 1fr; gap: 2.5rem; row-gap: 3.5rem; }
@media (min-width: 640px) { .trips-grid { grid-template-columns: 1fr 1fr; } }
@media (min-width: 1024px) { .trips-grid { grid-template-columns: 1fr 1fr 1fr; } }
.trip-card { cursor: pointer; display: block; text-align: right; width: 100%; padding: 0; }
.trip-card .cover { margin-bottom: 1rem; }
.trip-card-body { padding: 0 0.25rem; }
.trip-card-location { font-size: 0.75rem; margin-bottom: 0.5rem; }
.trip-card-title { font-size: 1.5rem; font-weight: 600; line-height: 1.2; margin-bottom: 0.5rem; color: var(--ink); }
@media (min-width: 640px) { .trip-card-title { font-size: 1.7rem; } }
.trip-card-title-inner { display: inline-flex; align-items: baseline; gap: 0.5rem; }
.trip-card-emoji { font-size: 1rem; }
.trip-card-subtitle { font-size: 0.9375rem; line-height: 1.6; margin-bottom: 0.75rem; color: var(--ink-soft); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.trip-card-meta { font-size: 0.875rem; display: flex; align-items: center; gap: 0.5rem; color: var(--ink-mute); }

.grid-section { padding-bottom: 5rem; }
.grid-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; margin-bottom: 2.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--line); }
.grid-title-label { font-size: 0.75rem; margin-bottom: 0.5rem; }
.grid-title { font-size: 2.25rem; font-weight: 600; color: var(--ink); }
@media (min-width: 640px) { .grid-title { font-size: 3rem; } }
.empty-state { text-align: center; padding: 4rem 0; color: var(--ink-mute); }
.empty-state-small { text-align: center; padding: 2.5rem 0; color: var(--ink-mute); }

/* =========================================================
   TRIP DETAIL
   ========================================================= */
.trip-detail-card { max-width: 48rem; margin: -3rem auto 0; padding: 0 1.25rem; position: relative; }
@media (min-width: 640px) { .trip-detail-card { margin-top: -4rem; padding: 0 2rem; } }
.trip-detail-inner { border-radius: 1rem; padding: 1.75rem; background: var(--cream-3); box-shadow: 0 18px 50px -25px rgba(31,26,20,0.25); }
@media (min-width: 640px) { .trip-detail-inner { padding: 2.5rem; } }
.trip-detail-back { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; margin-bottom: 1.5rem; color: var(--ink); transition: color 0.2s ease; }
.trip-detail-back:hover { color: var(--terracotta); }
.trip-detail-loc { display: flex; align-items: center; gap: 0.75rem; font-size: 0.875rem; margin-bottom: 1rem; color: var(--terracotta); letter-spacing: 0.05em; }
.trip-detail-title { font-size: 2.25rem; font-weight: 600; line-height: 1.1; margin-bottom: 1.25rem; color: var(--ink); }
@media (min-width: 640px) { .trip-detail-title { font-size: 3rem; } }
@media (min-width: 768px) { .trip-detail-title { font-size: 3.75rem; } }
.trip-detail-title-inner { display: inline-flex; align-items: baseline; gap: 0.75rem; flex-wrap: wrap; }
.trip-detail-emoji { font-size: 1.5rem; }
@media (min-width: 640px) { .trip-detail-emoji { font-size: 1.875rem; } }
.trip-detail-subtitle { font-size: 1.125rem; line-height: 1.6; margin-bottom: 1.5rem; color: var(--ink-soft); }
.trip-detail-byline { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 1rem; padding-bottom: 1.5rem; margin-bottom: 1.75rem; border-bottom: 1px solid var(--line); }
.delete-btn { font-size: 0.75rem; display: inline-flex; align-items: center; gap: 0.375rem; opacity: 0.5; transition: opacity 0.2s ease; color: var(--ink-mute); }

.trip-detail-intro { font-family: 'Markazi Text', serif; font-size: 1.25rem; line-height: 1.6; color: var(--ink); }
@media (min-width: 640px) { .trip-detail-intro { font-size: 1.5rem; } }

/* =========================================================
   TIMELINE
   ========================================================= */
.timeline-section { max-width: 48rem; margin: 4rem auto 0; padding: 0 1.25rem 3rem; }
@media (min-width: 640px) { .timeline-section { padding: 0 2rem 3rem; } }
.timeline { position: relative; }
.timeline-line { position: absolute; top: 0.5rem; bottom: 0.5rem; right: 0.75rem; width: 2px; border-radius: 9999px; background: linear-gradient(180deg, var(--terracotta) 0%, var(--gold) 50%, var(--tan) 100%); }
.timeline-entry { position: relative; margin-bottom: 3.5rem; padding-right: 2.5rem; }
.timeline-entry:last-child { margin-bottom: 0; }
.timeline-dot { position: absolute; right: 4px; top: 0.5rem; width: 1rem; height: 1rem; border-radius: 9999px; border: 3px solid var(--cream); }
.timeline-date { font-size: 0.75rem; margin-bottom: 0.5rem; }
.timeline-title { font-size: 1.5rem; font-weight: 600; margin-bottom: 1rem; line-height: 1.2; color: var(--ink); }
@media (min-width: 640px) { .timeline-title { font-size: 1.875rem; } }
.timeline-body { font-size: 1.0625rem; line-height: 1.9; color: var(--ink-soft); }
.timeline-delete { margin-top: 0.75rem; font-size: 0.75rem; display: inline-flex; align-items: center; gap: 0.25rem; opacity: 0.4; transition: opacity 0.2s ease; color: var(--ink-mute); }
.timeline-delete:hover { opacity: 1; }

.add-moment-wrap { display: flex; justify-content: center; margin-top: 2.5rem; }
.end-ornament { text-align: center; padding-bottom: 5rem; color: var(--terracotta); letter-spacing: 0.6em; }

/* =========================================================
   FOOTER
   ========================================================= */
.footer { padding: 3rem 0; text-align: center; font-size: 0.875rem; border-top: 1px solid var(--line); color: var(--ink-mute); }
.footer-name { font-family: 'Markazi Text', serif; font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--ink); }
.footer-ornament { margin-top: 1rem; color: var(--terracotta); }

/* =========================================================
   MODAL
   ========================================================= */
.modal-overlay { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 1rem; background: rgba(31,26,20,0.55); animation: fadeIn 0.25s ease both; }
.modal { position: relative; width: 100%; max-width: 32rem; border-radius: 1rem; padding: 1.75rem; max-height: 90vh; overflow-y: auto; background: var(--cream-3); animation: modalIn 0.3s cubic-bezier(.2,.7,.2,1) both; }
.modal-close { position: absolute; top: 1rem; left: 1rem; color: var(--ink); transition: color 0.2s ease; }
.modal-close:hover { color: var(--terracotta); }
.modal-title { font-family: 'Markazi Text', serif; font-size: 1.875rem; font-weight: 600; margin-bottom: 1.5rem; color: var(--ink); }
.modal-form { display: flex; flex-direction: column; gap: 1rem; }
.modal-form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
@media (max-width: 480px) { .modal-form-row { grid-template-columns: 1fr; } }
.modal-form-actions { display: flex; gap: 0.75rem; padding-top: 1rem; }

/* =========================================================
   PALETTE & MOTIF SELECT
   ========================================================= */
.palette-grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 0.5rem; margin-top: 0.5rem; }
.palette-swatch { aspect-ratio: 1; border-radius: 9999px; transition: transform 0.2s ease, box-shadow 0.2s ease; cursor: pointer; border: none; padding: 0; }
.palette-swatch.active { transform: scale(1.15); box-shadow: 0 0 0 2px var(--ink); }
.motif-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; margin-top: 0.5rem; }
.motif-btn { border-radius: 0.5rem; padding: 0.5rem; font-size: 0.75rem; transition: background 0.2s ease, color 0.2s ease; background: var(--cream-2); color: var(--ink); cursor: pointer; border: none; font-family: inherit; }
.motif-btn.active { background: var(--ink); color: var(--cream-3); }
.motif-btn:hover { background: var(--tan-2); }
.motif-btn.active:hover { background: var(--ink); }

/* =========================================================
   LOADING & ANIMATIONS
   ========================================================= */
.loader { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.spinner { width: 1.5rem; height: 1.5rem; color: var(--terracotta); animation: spin 1s linear infinite; }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.fade-in { animation: fadeIn 0.5s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes modalIn { from { opacity: 0; transform: translateY(20px) scale(0.97); } to { opacity: 1; transform: none; } }

/* Selection */
::selection { background: var(--gold); color: var(--ink); }
</style>

/* =========================================================
   STORAGE
   ========================================================= */
function loadTrips() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) return JSON.parse(stored);
  } catch (e) { /* ignore */ }
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(SAMPLE_TRIPS)); } catch (e) {}
  return JSON.parse(JSON.stringify(SAMPLE_TRIPS));
}

function persistTrips() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.trips)); }
  catch (e) { console.warn('Could not persist trips:', e); }
}

/* =========================================================
   UTILS
   ========================================================= */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function newId() {
  return 't_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);
}

function coverHtml(palette, motif, sizeClass, motifSize) {
  motifSize = motifSize || 0.55;
  const p = PALETTES[palette] || PALETTES.warm;
  const inset = ((1 - motifSize) / 2) * 100;
  const svgStyle = 'top:' + inset + '%;right:' + inset + '%;width:' + (motifSize * 100) + '%;height:' + (motifSize * 100) + '%;';
  return '<div class="cover ' + sizeClass + '" style="background: linear-gradient(135deg, ' + p.from + ' 0%, ' + p.to + ' 100%);">' +
    '<div class="grain"></div>' +
    '<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet" style="' + svgStyle + '">' +
      motifSvg(motif, p.motif) +
    '</svg>' +
  '</div>';
}

    '<div class="grid-header">' +

  let timelineBody;
  if (trip.timeline.length === 0) {
    timelineBody = '<div class="empty-state-small">لا توجد لحظات بعد في هذه الرحلة.</div>';
  } else {
    timelineBody = '<div class="timeline"><div class="timeline-line"></div>' +
      trip.timeline.map(function(m){ return renderTimelineEntry(trip, m); }).join('') +
    '</div>';
  }

  return '' +
  '<article class="fade-in">' +
    coverHtml(trip.palette, trip.motif, 'cover-detail', 0.32) +
    '<div class="trip-detail-card">' +
      '<div class="trip-detail-inner">' +
        '<button class="trip-detail-back" data-action="go-home">' +
          ICONS.arrowRight + '<span>عودة إلى الرحلات</span>' +
        '</button>' +
        '<div class="trip-detail-loc">' + ICONS.mapPin + '<span>' + esc(trip.location) + '</span></div>' +
        '<h1 class="display trip-detail-title">' +
          '<span class="trip-detail-title-inner">' +
            '<span class="trip-detail-emoji">' + esc(trip.emoji) + '</span>' +
            '<span>' + esc(trip.title) + '</span>' +
          '</span>' +
        '</h1>' +
        '<p class="trip-detail-subtitle">' + esc(trip.subtitle) + '</p>' +
        '<div class="trip-detail-byline">' +
          renderByline(trip.date) +
          '<button class="delete-btn" data-action="delete-trip" data-id="' + esc(trip.id) + '">' +
            ICONS.trash + '<span>حذف الرحلة</span>' +
          '</button>' +
        '</div>' +
        (trip.intro ? '<p class="trip-detail-intro">' + esc(trip.intro) + '</p>' : '') +
      '</div>' +
    '</div>' +
    '<div class="timeline-section">' +
      '<div class="section-label" style="margin-bottom: 2.5rem;">' +
        '<span class="section-label-text">الخط الزمني</span>' +
        '<span class="section-label-line"></span>' +
      '</div>' +
      timelineBody +
      '<div class="add-moment-wrap">' +
        '<button class="btn btn-primary btn-sm" data-action="show-add-moment" data-id="' + esc(trip.id) + '">' +
          ICONS.plus + '<span>أضف لحظة</span>' +
        '</button>' +
      '</div>' +
    '</div>' +
    '<div class="end-ornament">✦ &nbsp; ✦ &nbsp; ✦</div>' +
  '</article>';
}

function renderFooter() {
  return '' +
  '<footer class="footer">' +
    '<div class="footer-name">إسراء ومُعتَز</div>' +
    '<div>مذكّرات سفر · صُنِعَ بحُبٍّ على الطريق</div>' +
    '<div class="footer-ornament ornament">✦</div>' +
  '</footer>';
}

function renderPaletteSelect(target, value) {
  return '<div class="palette-grid">' +
    Object.keys(PALETTES).map(function(key){
      const p = PALETTES[key];
      return '<button class="palette-swatch ' + (value === key ? 'active' : '') + '"' +
        ' style="background: linear-gradient(135deg, ' + p.from + ', ' + p.to + ');"' +
        ' data-action="select-palette" data-target="' + target + '" data-value="' + key + '" aria-label="' + key + '"></button>';
    }).join('') +
  '</div>';
}

function renderMotifSelect(target, value) {
  return '<div class="motif-grid">' +
    MOTIFS_LIST.map(function(m){
      return '<button class="motif-btn ' + (value === m ? 'active' : '') + '" data-action="select-motif" data-target="' + target + '" data-value="' + m + '">' +
        esc(MOTIF_LABELS[m]) +
      '</button>';
    }).join('') +
  '</div>';
}

function renderAddTripModal() {
  const f = state.addTripForm;
  return '' +
  '<div class="modal-overlay" data-modal="overlay">' +
    '<div class="modal">' +
      '<button class="modal-close" data-action="close-modal" aria-label="إغلاق">' + ICONS.x + '</button>' +
      '<h3 class="modal-title">رحلة جديدة</h3>' +
      '<div class="modal-form">' +
        coverHtml(f.palette, f.motif, 'cover-preview', 0.5) +
        '<div class="field-group">' +
          '<label class="field-label">العنوان</label>' +
          '<input class="input-field" data-form="addTripForm" data-field="title" value="' + esc(f.title) + '" placeholder="مثلاً: ليالٍ في مَراكش">' +
        '</div>' +
        '<div class="modal-form-row">' +
          '<div class="field-group">' +
            '<label class="field-label">الوجهة</label>' +
            '<input class="input-field" data-form="addTripForm" data-field="location" value="' + esc(f.location) + '" placeholder="المدينة، البلد">' +
          '</div>' +
          '<div class="field-group">' +
            '<label class="field-label">التاريخ</label>' +
            '<input class="input-field" data-form="addTripForm" data-field="date" value="' + esc(f.date) + '" placeholder="مثلاً: مايو 2026">' +
          '</div>' +
        '</div>' +
        '<div class="field-group">' +
          '<label class="field-label">الوصف</label>' +
          '<textarea class="input-field" data-form="addTripForm" data-field="subtitle" rows="2" placeholder="سطرٌ يلخّص روح الرحلة">' + esc(f.subtitle) + '</textarea>' +
        '</div>' +
        '<div class="field-group">' +
          '<label class="field-label">المقدمة (اختياري)</label>' +
          '<textarea class="input-field" data-form="addTripForm" data-field="intro" rows="3" placeholder="الفقرة الأولى من الرحلة">' + esc(f.intro) + '</textarea>' +
        '</div>' +
        '<div class="modal-form-row">' +
          '<div class="field-group">' +
            '<label class="field-label">الرمز التعبيري</label>' +
            '<input class="input-field" data-form="addTripForm" data-field="emoji" value="' + esc(f.emoji) + '" maxlength="3">' +
          '</div>' +
          '<div class="field-group">' +
            '<label class="field-label">زخرفة</label>' +
            '<input class="input-field" data-form="addTripForm" data-field="accent" value="' + esc(f.accent) + '" maxlength="2">' +
          '</div>' +
        '</div>' +
        '<div class="field-group">' +
          '<label class="field-label">لون الغلاف</label>' +
          renderPaletteSelect('trip', f.palette) +
        '</div>' +
        '<div class="field-group">' +
          '<label class="field-label">رمز الغلاف</label>' +
          renderMotifSelect('trip', f.motif) +
        '</div>' +
        '<div class="modal-form-actions">' +
          '<button class="btn btn-primary btn-flex" data-action="save-trip">حفظ الرحلة</button>' +
          '<button class="btn-cancel" data-action="close-modal">إلغاء</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function renderAddMomentModal() {
  const f = state.addMomentForm;
  return '' +
  '<div class="modal-overlay" data-modal="overlay">' +
    '<div class="modal">' +
      '<button class="modal-close" data-action="close-modal" aria-label="إغلاق">' + ICONS.x + '</button>' +
      '<h3 class="modal-title">لحظة جديدة</h3>' +
      '<div class="modal-form">' +
        coverHtml(f.palette, f.motif, 'cover-preview', 0.5) +
        '<div class="field-group">' +
          '<label class="field-label">التاريخ / المرحلة</label>' +
          '<input class="input-field" data-form="addMomentForm" data-field="date" value="' + esc(f.date) + '" placeholder="مثلاً: اليوم الثاني · 16 مارس">' +
        '</div>' +
        '<div class="field-group">' +
          '<label class="field-label">عنوان اللحظة</label>' +
          '<input class="input-field" data-form="addMomentForm" data-field="title" value="' + esc(f.title) + '" placeholder="مثلاً: صباحٌ في السوق القديم">' +
        '</div>' +
        '<div class="field-group">' +
          '<label class="field-label">النص</label>' +
          '<textarea class="input-field" data-form="addMomentForm" data-field="text" rows="5" placeholder="احكِ ما حدث، ما رأيت، وما شعرتَ به">' + esc(f.text) + '</textarea>' +
        '</div>' +
        '<div class="field-group">' +
          '<label class="field-label">لون الغلاف</label>' +
          renderPaletteSelect('moment', f.palette) +
        '</div>' +
        '<div class="field-group">' +
          '<label class="field-label">رمز الغلاف</label>' +
          renderMotifSelect('moment', f.motif) +
        '</div>' +
        '<div class="modal-form-actions">' +
          '<button class="btn btn-primary btn-flex" data-action="save-moment">أضف اللحظة</button>' +
          '<button class="btn-cancel" data-action="close-modal">إلغاء</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}

function renderApp() {
  const featured = state.trips.find(function(t){ return t.featured; }) || state.trips[0];
  const rest = featured ? state.trips.filter(function(t){ return t.id !== featured.id; }) : state.trips;
  const currentTrip = state.trips.find(function(t){ return t.id === state.currentTripId; });

  let main = '';
  if (state.view === 'home') {
    main = (featured ? renderFeaturedHero(featured) : '') + renderTripsGrid(rest);
  } else if (state.view === 'detail' && currentTrip) {
    main = renderTripDetail(currentTrip);
  } else {
    // fallback
    main = renderTripsGrid(state.trips);
  }

  return renderTopNav() + '<main>' + main + '</main>' + renderFooter() +
    (state.showAddTrip ? renderAddTripModal() : '') +
    (state.showAddMoment ? renderAddMomentModal() : '');
}

function render() {
  document.getElementById('app').innerHTML = renderApp();
  document.body.style.overflow = (state.showAddTrip || state.showAddMoment) ? 'hidden' : '';
}

/* =========================================================
   ACTIONS
   ========================================================= */
function openTrip(id) {
  state.currentTripId = id;
  state.view = 'detail';
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function goHome() {
  state.view = 'home';
  state.currentTripId = null;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showAddTrip() {
  state.showAddTrip = true;
  state.addTripForm = initialAddTripForm();
  render();
}

function showAddMoment(tripId) {
  state.showAddMoment = true;
  state.pendingMomentTripId = tripId;
  state.addMomentForm = initialAddMomentForm();
  render();
}

function closeModal() {
  state.showAddTrip = false;
  state.showAddMoment = false;
  state.pendingMomentTripId = null;
  render();
}

function saveTrip() {
  const f = state.addTripForm;
  if (!f.title.trim() || !f.location.trim()) {
    alert('من فضلك أدخل العنوان والوجهة');
    return;
  }
  const trip = {
    id: newId(),
    title: f.title, subtitle: f.subtitle, location: f.location,
    date: f.date, intro: f.intro,
    palette: f.palette, motif: f.motif,
    emoji: f.emoji || '✈️', accent: f.accent || '✦',
    featured: false, timeline: [],
  };
  state.trips = [trip].concat(state.trips);
  state.showAddTrip = false;
  state.currentTripId = trip.id;
  state.view = 'detail';
  persistTrips();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function saveMoment() {
  const f = state.addMomentForm;
  if (!f.title.trim()) {
    alert('من فضلك أدخل عنوان اللحظة');
    return;
  }
  const moment = {
    id: newId(),
    date: f.date, title: f.title, text: f.text,
    palette: f.palette, motif: f.motif,
  };
  const targetId = state.pendingMomentTripId;
  state.trips = state.trips.map(function(t){
    return t.id === targetId ? Object.assign({}, t, { timeline: t.timeline.concat([moment]) }) : t;
  });
  state.showAddMoment = false;
  state.pendingMomentTripId = null;
  persistTrips();
  render();
}

function deleteTrip(id) {
  state.trips = state.trips.filter(function(t){ return t.id !== id; });
  state.view = 'home';
  state.currentTripId = null;
  persistTrips();
  render();
}

function deleteMoment(tripId, momentId) {
  state.trips = state.trips.map(function(t){
    return t.id === tripId
      ? Object.assign({}, t, { timeline: t.timeline.filter(function(m){ return m.id !== momentId; }) })
      : t;
  });
  persistTrips();
  render();
}

function selectPalette(target, value) {
  if (target === 'trip') state.addTripForm.palette = value;
  else state.addMomentForm.palette = value;
  render();
}

function selectMotif(target, value) {
  if (target === 'trip') state.addTripForm.motif = value;
  else state.addMomentForm.motif = value;
  render();
}

/* =========================================================
   EVENT DELEGATION
   ========================================================= */
function handleClick(e) {
  // Click on modal overlay (outside the modal content) closes modal
  if (e.target.dataset && e.target.dataset.modal === 'overlay') {
    closeModal();
    return;
  }

  const target = e.target.closest('[data-action]');
  if (!target) return;

  const action = target.dataset.action;
  const id = target.dataset.id;
  const tripId = target.dataset.tripId;
  const value = target.dataset.value;
  const ttype = target.dataset.target;

  switch (action) {
    case 'go-home': goHome(); break;
    case 'open-trip': openTrip(id); break;
    case 'show-add-trip': showAddTrip(); break;
    case 'show-add-moment': showAddMoment(id); break;
    case 'close-modal': closeModal(); break;
    case 'delete-trip':
      if (confirm('هل تريد حذف هذه الرحلة؟ لا يمكن التراجع.')) deleteTrip(id);
      break;
    case 'delete-moment':
      if (confirm('هل تريد حذف هذه اللحظة؟')) deleteMoment(tripId, id);
      break;
    case 'save-trip': saveTrip(); break;
    case 'save-moment': saveMoment(); break;
    case 'select-palette': selectPalette(ttype, value); break;
    case 'select-motif': selectMotif(ttype, value); break;
  }
}

function handleInput(e) {
  const form = e.target.dataset.form;
  const field = e.target.dataset.field;
  if (form && field && state[form]) {
    // Silent update — no re-render so the input keeps focus while typing
    state[form][field] = e.target.value;
  }
}

function handleKeydown(e) {
  if (e.key === 'Escape' && (state.showAddTrip || state.showAddMoment)) {
    closeModal();
  }
}

/* =========================================================
   INIT
   ========================================================= */
function init() {
  state.trips = loadTrips();
  document.getElementById('app').addEventListener('click', handleClick);
  document.getElementById('app').addEventListener('input', handleInput);
  document.addEventListener('keydown', handleKeydown);
  render();
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
